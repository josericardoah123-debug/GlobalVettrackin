<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="LabTrack"/>

<link rel="manifest" href="/manifest.json"/>
<title>LabTrack</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:10px}
input,select,textarea,button{font-family:inherit}
.map-container{width:100%;height:100%;min-height:300px}
</style>

<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ─── API ──────────────────────────────────────────────────────────────────────
const API={
  async req(method,path,body){
    const r=await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Error del servidor");
    return d;
  },
  get(p){return this.req("GET",p)},
  post(p,b){return this.req("POST",p,b)},
  patch(p,b){return this.req("PATCH",p,b)},
};

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const COLORS={
  purple:{bg:"#EEEDFE",text:"#3C3489",border:"#534AB7"},
  teal:  {bg:"#E1F5EE",text:"#085041",border:"#0F6E56"},
  amber: {bg:"#FAEEDA",text:"#854F0B",border:"#BA7517"},
  blue:  {bg:"#E6F1FB",text:"#185FA5",border:"#378ADD"},
  coral: {bg:"#FAECE7",text:"#712B13",border:"#D85A30"},
  green: {bg:"#EAF3DE",text:"#27500A",border:"#639922"},
};
const fmt=n=>new Intl.NumberFormat("es-HN",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const uid=()=>Math.random().toString(36).slice(2,8);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

// ─── UI HELPERS ───────────────────────────────────────────────────────────────
function Avatar({initials,color="purple",size=36,radius="50%"}){
  const c=COLORS[color]||COLORS.purple;
  return <div style={{width:size,height:size,borderRadius:radius,background:c.bg,color:c.text,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.36,fontWeight:700,flexShrink:0,fontFamily:"'DM Mono',monospace"}}>{(initials||"?").slice(0,2)}</div>;
}
function Badge({type,children}){
  const S={pendiente:{background:"#FAEEDA",color:"#854F0B"},aprobado:{background:"#EAF3DE",color:"#3B6D11"},reembolsado:{background:"#EEEDFE",color:"#3C3489"},info:{background:"#E6F1FB",color:"#185FA5"},danger:{background:"#FCEBEB",color:"#A32D2D"},warning:{background:"#FAEEDA",color:"#854F0B"},success:{background:"#EAF3DE",color:"#3B6D11"},transit:{background:"#E6F1FB",color:"#185FA5"},entrega:{background:"#E1F5EE",color:"#085041"},instalación:{background:"#EEEDFE",color:"#3C3489"},available:{background:"#EAF3DE",color:"#3B6D11"},on_route:{background:"#E6F1FB",color:"#185FA5"}};
  const s=S[type]||S.info;
  return <span style={{...s,fontSize:11,padding:"3px 9px",borderRadius:20,fontWeight:600,display:"inline-block",whiteSpace:"nowrap"}}>{children}</span>;
}
function Btn({onClick,variant="secondary",children,disabled,small,full}){
  const S={primary:{background:"var(--accent)",color:"white",border:"none"},secondary:{background:"var(--surface)",color:"var(--text)",border:"1px solid var(--border)"},danger:{background:"#993C1D",color:"white",border:"none"},success:{background:"#0F6E56",color:"white",border:"none"}};
  const s=S[variant]||S.secondary;
  return <button onClick={onClick} disabled={disabled} style={{...s,borderRadius:8,padding:small?"6px 12px":"9px 18px",fontSize:small?12:13,fontWeight:600,cursor:disabled?"default":"pointer",opacity:disabled?0.4:1,display:"inline-flex",alignItems:"center",gap:6,width:full?"100%":undefined,justifyContent:full?"center":undefined}}>{children}</button>;
}
function Modal({title,onClose,children,wide}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"var(--card)",borderRadius:16,width:"100%",maxWidth:wide?800:520,maxHeight:"92vh",overflow:"auto",border:"1px solid var(--border)",boxShadow:"0 24px 64px rgba(0,0,0,.3)"}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:"var(--card)",zIndex:1}}>
          <span style={{fontWeight:700,fontSize:16,color:"var(--text)"}}>{title}</span>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text2)",fontSize:22,padding:4}}>×</button>
        </div>
        <div style={{padding:20}}>{children}</div>
      </div>
    </div>
  );
}
function Field({label,children,span}){
  return <div style={span?{gridColumn:`span ${span}`}:{}}><label style={{fontSize:12,color:"var(--text2)",display:"block",marginBottom:4}}>{label}</label>{children}</div>;
}
function Input({value,onChange,placeholder,type="text",style={}}){
  return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13,...style}}/>;
}
function Select({value,onChange,children}){
  return <select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13}}>{children}</select>;
}
function Spinner(){return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:200,color:"var(--text2)",fontSize:13,gap:8}}><div style={{width:20,height:20,border:"2px solid var(--border)",borderTopColor:"var(--accent)",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>Cargando...</div>;}


// ─── PLACES SEARCH (Google Places Autocomplete) ──────────────────────────────
function PlacesSearch({apiKey, onSelect, placeholder="Buscar cliente en Google Maps..."}){
  const inputRef=useRef(null);
  const autocompleteRef=useRef(null);

  useEffect(()=>{
    if(!apiKey||!inputRef.current) return;
    const init=()=>{
      if(!window.google||!window.google.maps||!window.google.maps.places) return;
      autocompleteRef.current=new window.google.maps.places.Autocomplete(inputRef.current,{
        componentRestrictions:{country:"hn"},
        fields:["name","geometry","formatted_address","address_components"]
      });
      autocompleteRef.current.addListener("place_changed",()=>{
        const place=autocompleteRef.current.getPlace();
        if(!place.geometry) return;
        const lat=place.geometry.location.lat();
        const lng=place.geometry.location.lng();
        // Extract city and department from address_components
        let city="",department="";
        (place.address_components||[]).forEach(c=>{
          if(c.types.includes("locality")) city=c.long_name;
          if(c.types.includes("administrative_area_level_1")) department=c.long_name;
        });
        onSelect({
          name:place.name||"",
          address:place.formatted_address||"",
          lat,lng,city,department
        });
      });
    };
    if(window.google&&window.google.maps&&window.google.maps.places) init();
    else {
      const interval=setInterval(()=>{if(window.google?.maps?.places){clearInterval(interval);init();}},300);
      return()=>clearInterval(interval);
    }
  },[apiKey]);

  if(!apiKey) return null;
  return(
    <div style={{position:"relative",marginBottom:8}}>
      <input ref={inputRef} placeholder={placeholder}
        style={{width:"100%",padding:"9px 12px 9px 32px",borderRadius:8,border:"1px solid #185FA5",background:"var(--surface)",color:"var(--text)",fontSize:13}}/>
      <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:14}}>🔍</span>
    </div>
  );
}

// ─── GOOGLE MAP COMPONENT ─────────────────────────────────────────────────────
function GoogleMap({trip,apiKey,height=320}){
  const ref=useRef(null);
  const mapRef=useRef(null);

  useEffect(()=>{
    if(!apiKey||!trip||!ref.current) return;

    const initMap=()=>{
      if(!window.google||mapRef.current) return;
      const pts=trip.routePoints||[];
      const center=pts.length?{lat:pts[Math.floor(pts.length/2)][0],lng:pts[Math.floor(pts.length/2)][1]}:{lat:trip.origin.lat,lng:trip.origin.lng};

      const map=new window.google.maps.Map(ref.current,{
        center,zoom:10,
        mapTypeId:"roadmap",
        styles:[{featureType:"poi",stylers:[{visibility:"off"}]}],
        mapTypeControl:false,streetViewControl:false,
      });
      mapRef.current=map;

      const originPos={lat:trip.origin.lat,lng:trip.origin.lng};
      const destPos={lat:trip.destination.lat,lng:trip.destination.lng};

      // If we have real GPS points (more than 2), draw them as actual route
      if(pts.length>2){
        const path=pts.map(p=>({lat:p[0],lng:p[1]}));
        new window.google.maps.Polyline({path,geodesic:true,strokeColor:"#185FA5",strokeOpacity:0.9,strokeWeight:4,map});
        // Markers
        new window.google.maps.Marker({position:originPos,map,label:{text:"A",color:"white",fontWeight:"bold"},icon:{path:window.google.maps.SymbolPath.CIRCLE,fillColor:"#1D9E75",fillOpacity:1,strokeColor:"white",strokeWeight:2,scale:14}});
        new window.google.maps.Marker({position:destPos,map,label:{text:"B",color:"white",fontWeight:"bold"},icon:{path:window.google.maps.SymbolPath.CIRCLE,fillColor:"#D85A30",fillOpacity:1,strokeColor:"white",strokeWeight:2,scale:14}});
        const bounds=new window.google.maps.LatLngBounds();
        path.forEach(p=>bounds.extend(p));
        map.fitBounds(bounds,{top:40,right:40,bottom:40,left:40});
      } else {
        // Use Directions API for road route between origin and destination
        const directionsService=new window.google.maps.DirectionsService();
        const directionsRenderer=new window.google.maps.DirectionsRenderer({
          map,suppressMarkers:true,
          polylineOptions:{strokeColor:"#185FA5",strokeOpacity:0.9,strokeWeight:4}
        });
        directionsService.route({
          origin:originPos,
          destination:destPos,
          travelMode:window.google.maps.TravelMode.DRIVING
        },(result,status)=>{
          if(status==="OK") directionsRenderer.setDirections(result);
        });
        // Origin marker
        new window.google.maps.Marker({position:originPos,map,label:{text:"A",color:"white",fontWeight:"bold"},icon:{path:window.google.maps.SymbolPath.CIRCLE,fillColor:"#1D9E75",fillOpacity:1,strokeColor:"white",strokeWeight:2,scale:14}});
        // Destination marker
        new window.google.maps.Marker({position:destPos,map,label:{text:"B",color:"white",fontWeight:"bold"},icon:{path:window.google.maps.SymbolPath.CIRCLE,fillColor:"#D85A30",fillOpacity:1,strokeColor:"white",strokeWeight:2,scale:14}});
      }

      // Stop markers
      (trip.stops||[]).forEach((s,i)=>{
        new window.google.maps.Marker({
          position:{lat:s.lat,lng:s.lng},map,
          label:{text:"P",color:"white",fontWeight:"bold"},
          title:s.label,
          icon:{path:window.google.maps.SymbolPath.CIRCLE,fillColor:"#EF9F27",fillOpacity:1,strokeColor:"white",strokeWeight:2,scale:12}
        });
      });
    };

    // Load Google Maps script if needed
    if(window.google&&window.google.maps){
      initMap();
    } else if(!document.getElementById("gmaps-script")){
      const s=document.createElement("script");
      s.id="gmaps-script";
      s.src=`https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=directions,places&callback=__labtrackMapInit`;
      window.__labtrackMapInit=initMap;
      document.head.appendChild(s);
    } else {
      // Script loading, wait
      const interval=setInterval(()=>{if(window.google&&window.google.maps){clearInterval(interval);initMap();}},200);
      return()=>clearInterval(interval);
    }
  },[trip,apiKey]);

  if(!apiKey){
    return <SvgMap trip={trip} height={height} mapsKey={apiKey}/>;
  }

  return(
    <div style={{borderRadius:12,overflow:"hidden",border:"1px solid var(--border)"}}>
      <div ref={ref} style={{height,width:"100%"}}/>
      <div style={{padding:"8px 14px",background:"white",borderTop:"1px solid #dde3ea",display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#666"}}>Equipos:</span>
        {(trip.equipmentIds||[]).map(id=><span key={id} style={{background:"#EEEDFE",color:"#3C3489",fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:500}}>{id}</span>)}
      </div>
    </div>
  );
}

// ─── SVG FALLBACK MAP ─────────────────────────────────────────────────────────
function SvgMap({trip,height=320,mapsKey=""}){
  const W=700,H=height||320,pad=44;
  const pts=trip.routePoints||[];
  if(!pts.length) return <div style={{background:"#eef2f7",borderRadius:12,padding:24,textAlign:"center",color:"#888",fontSize:13,height:H,display:"flex",alignItems:"center",justifyContent:"center"}}>Sin datos de ruta</div>;
  const lats=pts.map(p=>p[0]),lngs=pts.map(p=>p[1]);
  const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
  const proj=([lat,lng])=>[
    minLng===maxLng?(W/2):pad+((lng-minLng)/(maxLng-minLng))*(W-pad*2),
    minLat===maxLat?(H/2):(H-pad)-((lat-minLat)/(maxLat-minLat))*(H-pad*2)
  ];
  const projected=pts.map(proj);
  const pathD=projected.map((p,i)=>`${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const oP=proj([trip.origin.lat,trip.origin.lng]);
  const dP=proj([trip.destination.lat,trip.destination.lng]);
  const stopPts=(trip.stops||[]).map(s=>({...s,pt:proj([s.lat,s.lng])}));
  return(
    <div style={{background:"#eef2f7",borderRadius:12,overflow:"hidden",border:"1px solid var(--border)"}}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block"}}>
        {[0.25,0.5,0.75].map((t,i)=><g key={i}><line x1={pad+t*(W-pad*2)} y1={pad} x2={pad+t*(W-pad*2)} y2={H-pad} stroke="#cdd5df" strokeWidth={1} strokeDasharray="3,3"/><line x1={pad} y1={pad+t*(H-pad*2)} x2={W-pad} y2={pad+t*(H-pad*2)} stroke="#cdd5df" strokeWidth={1} strokeDasharray="3,3"/></g>)}
        <path d={pathD} fill="none" stroke="#185FA5" strokeWidth={5} strokeOpacity={0.12} strokeLinecap="round" strokeLinejoin="round"/>
        <path d={pathD} fill="none" stroke="#185FA5" strokeWidth={3} strokeLinecap="round" strokeLinejoin="round"/>
        {projected.slice(1,-1).filter((_,i)=>i%2===0).map(([x,y],i)=><circle key={i} cx={x} cy={y} r={3} fill="#185FA5" fillOpacity={0.35}/>)}
        {stopPts.map((s,i)=><g key={i}><circle cx={s.pt[0]} cy={s.pt[1]} r={11} fill="white" stroke="#EF9F27" strokeWidth={2}/><text x={s.pt[0]} y={s.pt[1]+1} textAnchor="middle" dominantBaseline="middle" fontSize={11} fill="#854F0B" fontWeight="700">P</text><rect x={s.pt[0]+13} y={s.pt[1]-15} width={Math.min(s.label.length*6,130)} height={19} rx={4} fill="white" stroke="#EF9F27" strokeWidth={1} opacity={0.95}/><text x={s.pt[0]+17} y={s.pt[1]-5} fontSize={10} fill="#854F0B" fontWeight="500">{s.label}</text></g>)}
        <circle cx={oP[0]} cy={oP[1]} r={15} fill="#1D9E75" opacity={0.15}/><circle cx={oP[0]} cy={oP[1]} r={9} fill="#1D9E75"/>
        <text x={oP[0]} y={oP[1]+1} textAnchor="middle" dominantBaseline="middle" fontSize={11} fill="white" fontWeight="700">A</text>
        <rect x={oP[0]+15} y={oP[1]-13} width={Math.min((trip.origin.label||"").length*5.5,160)} height={19} rx={4} fill="#1D9E75" opacity={0.9}/>
        <text x={oP[0]+19} y={oP[1]-3} fontSize={10} fill="white" fontWeight="500">{trip.origin.label}</text>
        <circle cx={dP[0]} cy={dP[1]} r={15} fill="#D85A30" opacity={0.15}/><circle cx={dP[0]} cy={dP[1]} r={9} fill="#D85A30"/>
        <text x={dP[0]} y={dP[1]+1} textAnchor="middle" dominantBaseline="middle" fontSize={11} fill="white" fontWeight="700">B</text>
        <rect x={dP[0]-(Math.min((trip.destination.label||"").length*5.5,180)+15)} y={dP[1]-13} width={Math.min((trip.destination.label||"").length*5.5,180)} height={19} rx={4} fill="#D85A30" opacity={0.9}/>
        <text x={dP[0]-(Math.min((trip.destination.label||"").length*5.5,180)+11)} y={dP[1]-3} fontSize={10} fill="white" fontWeight="500">{trip.destination.label}</text>
        <g transform={`translate(${W-130},${H-78})`}><rect x={0} y={0} width={122} height={68} rx={8} fill="white" stroke="#cdd5df" strokeWidth={1} opacity={0.96}/><circle cx={16} cy={17} r={5} fill="#1D9E75"/><text x={26} y={21} fontSize={11} fill="#444">A · Origen</text><circle cx={16} cy={36} r={5} fill="#D85A30"/><text x={26} y={40} fontSize={11} fill="#444">B · Destino</text><circle cx={16} cy={55} r={5} fill="#EF9F27"/><text x={26} y={59} fontSize={11} fill="#444">P · Parada</text></g>
        <rect x={pad} y={pad-26} width={200} height={20} rx={5} fill="white" stroke="#cdd5df" strokeWidth={1} opacity={0.92}/>
        <text x={pad+8} y={pad-12} fontSize={11} fill="#185FA5" fontWeight="600">{trip.km} km · {trip.startTime}–{trip.endTime} · {(trip.stops||[]).length} parada{(trip.stops||[]).length!==1?"s":""}</text>
      </svg>
      <div style={{padding:"8px 14px",borderTop:"1px solid #dde3ea",display:"flex",gap:6,flexWrap:"wrap",background:"white",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#666"}}>Equipos:</span>
        {(trip.equipmentIds||[]).map(id=><span key={id} style={{background:"#EEEDFE",color:"#3C3489",fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:500}}>{id}</span>)}
        {!mapsKey&&<span style={{marginLeft:"auto",fontSize:10,color:"#999"}}>Configure Google Maps en Ajustes para mapa real</span>}
      </div>
    </div>
  );
}

// ─── TRIP DETAIL ──────────────────────────────────────────────────────────────
function TripDetail({trip,techs,clients,inventory,onClose,onApprove,mapsKey,fuelGasPrice=95,fuelDieselPrice=85}){
  if(!trip) return null;
  // Safety conversions
  const safeTrip={...trip,km:+(trip.km||0),reimbursement:+(trip.reimbursement||0),equipmentIds:trip.equipmentIds||[],stops:trip.stops||[],routePoints:trip.routePoints||[]};
  trip=safeTrip;
  const tech=techs.find(t=>t.id===trip.technicianId)||{name:"—",color:"blue",phone:""};
  const client=clients.find(c=>c.id===trip.clientId)||{name:"—",city:"",department:"",contact:""};
  const equips=(trip.equipmentIds||[]).map(id=>inventory.find(e=>e.id===id)).filter(Boolean);
  return(
    <Modal title="Detalle del viaje" onClose={onClose} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        <div style={{background:"var(--surface)",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:"var(--text2)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}}>Técnico</div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Avatar initials={tech?.name?.split(" ").map(w=>w[0]).join("").slice(0,2)} color={tech?.color} size={38}/>
            <div><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{tech?.name}</div><div style={{fontSize:12,color:"var(--text2)"}}>{tech?.phone}</div></div>
          </div>
        </div>
        <div style={{background:"var(--surface)",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:"var(--text2)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}}>Cliente</div>
          <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{client?.name}</div>
          <div style={{fontSize:12,color:"var(--text2)"}}>{client?.city}, {client?.department}</div>
          <div style={{fontSize:12,color:"var(--text2)"}}>{client?.contact}</div>
        </div>
      </div>
      {/* Fuel calculation */}
      {(()=>{
        const tech=techs.find(t=>t.id===trip.technicianId);
        const rendimiento=tech?.rendimiento||12;
        const tipoComb=tech?.tipoCombustible||"gasolina";
        const litros=trip.km/rendimiento;
        const precioComb=tipoComb==="diesel"?fuelDieselPrice:fuelGasPrice;
        const costoCombs=litros*precioComb;
        return(
          <div style={{background:"#FFF9F0",borderRadius:10,padding:"10px 14px",marginBottom:12,border:"1px solid #EF9F27"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#854F0B",textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:6}}>⛽ Cálculo de combustible</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,fontSize:12}}>
              <div><div style={{color:"#854F0B"}}>Rendimiento</div><div style={{fontWeight:700,color:"#5C3209"}}>{rendimiento} km/L</div></div>
              <div><div style={{color:"#854F0B"}}>Litros usados</div><div style={{fontWeight:700,color:"#5C3209"}}>{litros.toFixed(1)} L</div></div>
              <div><div style={{color:"#854F0B"}}>Costo combustible</div><div style={{fontWeight:700,color:"#5C3209"}}>L.{fmt(costoCombs)}</div></div>
            </div>
            <div style={{marginTop:8,background:"#EF9F27",borderRadius:6,padding:"6px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:12,color:"white",fontWeight:600}}>Total a reembolsar (km + combustible)</span>
              <span style={{fontSize:15,color:"white",fontWeight:800}}>L.{fmt(trip.reimbursement+costoCombs)}</span>
            </div>
          </div>
        );
      })()}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
        {(()=>{
          const tech2=techs.find(t=>t.id===trip.technicianId);
          const rend=+(tech2?.rendimiento||12);
          const litros=rend>0?(trip.km/rend):0;
          return [{l:"Fecha",v:trip.date},{l:"Distancia",v:`${trip.km} km`},{l:"Combustible",v:`${litros.toFixed(1)} L`},{l:"Reembolso",v:`L. ${fmt(trip.reimbursement)}`}];
        })().map(m=>(
          <div key={m.l} style={{background:"var(--surface)",borderRadius:8,padding:"10px 12px"}}>
            <div style={{fontSize:10,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em"}}>{m.l}</div>
            <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginTop:4}}>{m.v}</div>
          </div>
        ))}
      </div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>Mapa del recorrido</div>
        <GoogleMap trip={trip} apiKey={mapsKey} height={340}/>
      </div>
      {(trip.stops||[]).length>0&&(
        <div style={{marginBottom:14}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>Paradas</div>
          {trip.stops.map((s,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"#FAEEDA",borderRadius:8,padding:"8px 12px",marginBottom:6}}>
              <span style={{background:"#EF9F27",color:"white",borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>P</span>
              <span style={{fontSize:13,color:"#854F0B",fontWeight:500}}>{s.label}</span>
              {s.time&&<span style={{fontSize:12,color:"#854F0B",marginLeft:"auto"}}>{s.time}</span>}
            </div>
          ))}
        </div>
      )}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>Equipos en este viaje</div>
        {equips.length===0&&<div style={{fontSize:13,color:"var(--text2)"}}>Sin detalle</div>}
        {equips.map(eq=>(
          <div key={eq.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--surface)",borderRadius:8,padding:"10px 14px",marginBottom:6}}>
            <div><span style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{eq.name} {eq.model}</span><span style={{fontSize:11,color:"var(--text2)",marginLeft:10,fontFamily:"'DM Mono',monospace"}}>S/N: {eq.serial}</span></div>
            <Badge type={trip.tripType}>{trip.tripType}</Badge>
          </div>
        ))}
      </div>
      {trip.notes&&<div style={{background:"var(--surface)",borderRadius:8,padding:"12px 14px",marginBottom:14}}><div style={{fontSize:11,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>Notas</div><div style={{fontSize:13,color:"var(--text)",lineHeight:1.7}}>{trip.notes}</div></div>}
      
      {/* Report preview link */}
      {trip.reportId?(
        <div style={{background:"#E1F5EE",border:"1px solid #5DCAA5",borderRadius:10,padding:"12px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:12,fontWeight:700,color:"#0F6E56"}}>📋 Reporte de visita adjunto</div>
            <div style={{fontSize:11,color:"#085041",marginTop:2}}>{trip.reportNum||"Ver reporte generado"}</div>
          </div>
          <button onClick={()=>window.open(`/api/reports/${trip.reportId}/pdf`,"_blank")} style={{background:"#0F6E56",color:"white",border:"none",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
            📄 Ver PDF
          </button>
        </div>
      ):(
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",marginBottom:14}}>
          <div style={{fontSize:12,color:"var(--text2)"}}>📋 Sin reporte de visita adjunto</div>
        </div>
      )}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:14,borderTop:"1px solid var(--border)"}}>
        <Badge type={trip.status}>{trip.status}</Badge>
        <div style={{display:"flex",gap:8}}>
          {trip.status==="pendiente"&&onApprove&&<Btn variant="success" onClick={()=>onApprove(trip.id)}>✓ Aprobar y reembolsar</Btn>}
          <Btn onClick={onClose}>Cerrar</Btn>
        </div>
      </div>
    </Modal>
  );
}

// ─── LOGIN / REGISTER ─────────────────────────────────────────────────────────
function AuthScreen({onLogin}){
  const [mode,setMode]=useState("login");
  const [form,setForm]=useState({name:"",email:"",phone:"",password:"",confirm:""});
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const set=k=>v=>setForm(p=>({...p,[k]:v}));

  const submit=async()=>{
    setErr(""); setLoading(true);
    try{
      if(mode==="register"){
        if(form.password!==form.confirm){setErr("Las contraseñas no coinciden");setLoading(false);return;}
        const u=await API.post("/api/register",{name:form.name,email:form.email,phone:form.phone,password:form.password});
        onLogin(u);
      } else {
        const u=await API.post("/api/login",{email:form.email,password:form.password});
        onLogin(u);
      }
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0C447C 0%,#185FA5 50%,#1D9E75 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"white",borderRadius:20,padding:"32px 28px",width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,.25)"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:32,fontWeight:800,color:"#185FA5",letterSpacing:"-1px"}}>Lab<span style={{color:"#1a1d23"}}>Track</span></div>
          <div style={{fontSize:13,color:"#6b7685",marginTop:4}}>Plataforma de operaciones de campo</div>
        </div>

        <div style={{display:"flex",background:"#f0f2f5",borderRadius:10,padding:4,marginBottom:20}}>
          {["login","register"].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setErr("");}} style={{flex:1,padding:"8px",border:"none",borderRadius:8,background:mode===m?"white":"transparent",color:mode===m?"#185FA5":"#6b7685",fontWeight:mode===m?700:400,fontSize:13,cursor:"pointer",boxShadow:mode===m?"0 1px 4px rgba(0,0,0,.1)":"none"}}>
              {m==="login"?"Iniciar sesión":"Registrarse"}
            </button>
          ))}
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {mode==="register"&&(
            <>
              <div><label style={{fontSize:12,color:"#6b7685",display:"block",marginBottom:4}}>Nombre completo</label><Input value={form.name} onChange={set("name")} placeholder="Ej: Juan Martínez"/></div>
              <div><label style={{fontSize:12,color:"#6b7685",display:"block",marginBottom:4}}>Teléfono</label><Input value={form.phone} onChange={set("phone")} placeholder="+504 9xxx-xxxx"/></div>
            </>
          )}
          <div><label style={{fontSize:12,color:"#6b7685",display:"block",marginBottom:4}}>Correo electrónico</label><Input value={form.email} onChange={set("email")} placeholder="correo@empresa.hn" type="email"/></div>
          <div><label style={{fontSize:12,color:"#6b7685",display:"block",marginBottom:4}}>Contraseña</label><Input value={form.password} onChange={set("password")} placeholder={mode==="register"?"Mínimo 6 caracteres":"••••••••"} type="password"/></div>
          {mode==="register"&&<div><label style={{fontSize:12,color:"#6b7685",display:"block",marginBottom:4}}>Confirmar contraseña</label><Input value={form.confirm} onChange={set("confirm")} placeholder="Repetir contraseña" type="password"/></div>}
        </div>

        {err&&<div style={{background:"#FCEBEB",color:"#A32D2D",borderRadius:8,padding:"10px 14px",fontSize:13,marginTop:14,fontWeight:500}}>{err}</div>}

        <button onClick={submit} disabled={loading} style={{width:"100%",background:"#185FA5",color:"white",border:"none",borderRadius:10,padding:14,fontSize:15,fontWeight:700,cursor:loading?"default":"pointer",opacity:loading?0.7:1,marginTop:20}}>
          {loading?"Cargando...":mode==="login"?"Entrar":"Crear cuenta"}
        </button>

        {mode==="login"&&(
          <div style={{marginTop:16,background:"#f0f2f5",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#6b7685"}}>
            <div style={{fontWeight:600,marginBottom:4}}>Cuentas de prueba:</div>
            <div>Admin: admin@labtrack.hn / admin123</div>
            <div>Técnico: carlos@labtrack.hn / tech123</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({trips,techs,inventory,clients,onViewTrip}){
  const totalKm=trips.reduce((s,t)=>s+t.km,0);
  const pending=trips.filter(t=>t.status==="pendiente");
  const pendingAmt=pending.reduce((s,t)=>s+t.reimbursement,0);
  const lowStock=inventory.filter(e=>e.stock<=1);
  const outStock=inventory.filter(e=>e.stock===0);

  return(
    <div>
      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:22}}>
        {[{l:"Km este mes",v:totalKm.toLocaleString(),s:`${trips.length} viajes`},{l:"Reembolso pendiente",v:`L.${fmt(pendingAmt)}`,s:`${pending.length} viajes`},{l:"Activos ahora",v:techs.filter(t=>t.status==="on_route").length,s:"en ruta"},{l:"Entregas",v:trips.filter(t=>t.tripType==="entrega").length,s:"este mes"},{l:"Stock bajo",v:lowStock.length,s:"artículos"}].map(m=>(
          <div key={m.l} style={{background:"var(--surface)",borderRadius:10,padding:14}}>
            <div style={{fontSize:11,color:"var(--text2)",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.04em"}}>{m.l}</div>
            <div style={{fontSize:22,fontWeight:800,color:"var(--text)",lineHeight:1}}>{m.v}</div>
            <div style={{fontSize:11,color:"var(--text2)",marginTop:4}}>{m.s}</div>
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,marginBottom:18}}>
        {/* Technicians */}
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Técnicos — estado en vivo</div>
          {techs.filter(u=>u.role==="technician").map(tech=>{
            const at=trips.find(t=>t.id===tech.currentTripId);
            const cl=at?clients.find(c=>c.id===at?.clientId):null;
            const initials=tech.name.split(" ").map(w=>w[0]).join("").slice(0,2);
            return(
              <div key={tech.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:14,display:"flex",gap:12,marginBottom:8}}>
                <Avatar initials={initials} color={tech.color} size={42}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{tech.name}</div>
                  <div style={{fontSize:12,color:"var(--text2)",marginTop:2}}>
                    {tech.status==="on_route"?<><span style={{color:"#1D9E75",fontWeight:700}}>● </span>En ruta → {cl?.name}</>:"○ Disponible"}
                  </div>
                  {at&&<div style={{marginTop:5,fontSize:12}}><span style={{color:"var(--text2)"}}>{at.km} km · </span><span style={{color:"var(--accent)",cursor:"pointer",textDecoration:"underline"}} onClick={()=>onViewTrip(at)}>Ver mapa</span></div>}
                </div>
                <Badge type={tech.status==="on_route"?"on_route":"available"}>{tech.status==="on_route"?"En ruta":"Disponible"}</Badge>
              </div>
            );
          })}
        </div>

        {/* Pending */}
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Pendientes de aprobación</div>
          {pending.length===0&&<div style={{color:"var(--text2)",fontSize:13,padding:14,background:"var(--surface)",borderRadius:10}}>Todo al día ✓</div>}
          {pending.slice(0,4).map(trip=>{
            const tech=techs.find(t=>t.id===trip.technicianId);
            const cl=clients.find(c=>c.id===trip.clientId);
            return(
              <div key={trip.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 14px",marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <div><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{cl?.name}</div><div style={{fontSize:12,color:"var(--text2)",marginTop:2}}>{tech?.name} · {trip.date}</div></div>
                  <div style={{textAlign:"right"}}><div style={{fontWeight:800,fontSize:15,color:"var(--accent)"}}>L.{fmt(trip.reimbursement)}</div><div style={{fontSize:11,color:"var(--text2)"}}>{trip.km} km</div></div>
                </div>
                <div style={{marginTop:10}}><Btn small onClick={()=>onViewTrip(trip)}>Ver mapa y aprobar</Btn></div>
              </div>
            );
          })}
        </div>
      </div>

      {/* INVENTORY SECTION */}
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:"16px 18px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Inventario — resumen</div>
          <div style={{display:"flex",gap:8,fontSize:12}}>
            <span style={{background:"#EAF3DE",color:"#3B6D11",padding:"3px 10px",borderRadius:20,fontWeight:600}}>{inventory.filter(e=>e.stock>1).length} disponibles</span>
            <span style={{background:"#FAEEDA",color:"#854F0B",padding:"3px 10px",borderRadius:20,fontWeight:600}}>{lowStock.length} stock bajo</span>
            {outStock.length>0&&<span style={{background:"#FCEBEB",color:"#A32D2D",padding:"3px 10px",borderRadius:20,fontWeight:600}}>{outStock.length} sin stock</span>}
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:8}}>
          {inventory.map(eq=>{
            const color=eq.stock===0?"#FCEBEB":eq.stock<=1?"#FAEEDA":"#EAF3DE";
            const textColor=eq.stock===0?"#A32D2D":eq.stock<=1?"#854F0B":"#3B6D11";
            return(
              <div key={eq.id} style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{eq.name}</div>
                  <div style={{fontSize:11,color:"var(--text2)",marginTop:1}}>{eq.model} · {eq.category}</div>
                </div>
                <div style={{background:color,color:textColor,borderRadius:8,padding:"4px 10px",fontWeight:800,fontSize:16,minWidth:36,textAlign:"center"}}>
                  {eq.stock}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── VIAJES ───────────────────────────────────────────────────────────────────
function Viajes({trips,techs,clients,inventory,onViewTrip}){
  const [filter,setFilter]=useState("todos");
  const filtered=filter==="todos"?trips:trips.filter(t=>t.status===filter);
  const filters=[{k:"todos",l:"Todos"},{k:"pendiente",l:"Pendientes"},{k:"aprobado",l:"Aprobados"},{k:"reembolsado",l:"Reembolsados"}];
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {filters.map(f=>{
            const count=f.k==="todos"?trips.length:trips.filter(t=>t.status===f.k).length;
            return <button key={f.k} onClick={()=>setFilter(f.k)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",fontSize:12,cursor:"pointer",background:filter===f.k?"var(--accent)":"transparent",color:filter===f.k?"white":"var(--text2)",fontWeight:filter===f.k?700:400}}>{f.l} ({count})</button>;
          })}
        </div>
        <div style={{fontSize:12,color:"var(--text2)",fontWeight:500}}>{filtered.length} viajes · {filtered.reduce((s,t)=>s+t.km,0)} km · L.{fmt(filtered.reduce((s,t)=>s+t.reimbursement,0))}</div>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,overflow:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:700}}>
          <thead><tr style={{background:"var(--surface)"}}>{["Técnico","Cliente","Equipo","Fecha","Km","Reembolso","Tipo","Estado",""].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",fontSize:11,color:"var(--text2)",fontWeight:600,borderBottom:"1px solid var(--border)",textTransform:"uppercase",letterSpacing:"0.04em",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>
            {filtered.map((trip,i)=>{
              const tech=techs.find(t=>t.id===trip.technicianId);
              const cl=clients.find(c=>c.id===trip.clientId);
              const equips=(trip.equipmentIds||[]).map(id=>inventory.find(e=>e.id===id)).filter(Boolean);
              const initials=tech?.name?.split(" ").map(w=>w[0]).join("").slice(0,2)||"??";
              return(
                <tr key={trip.id} style={{borderBottom:i<filtered.length-1?"1px solid var(--border)":"none",cursor:"pointer"}} onClick={()=>onViewTrip(trip)} onMouseEnter={e=>e.currentTarget.style.background="var(--surface)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                  <td style={{padding:"10px 12px"}}><div style={{display:"flex",alignItems:"center",gap:7}}><Avatar initials={initials} color={tech?.color} size={26}/><span style={{fontWeight:500,color:"var(--text)"}}>{tech?.name?.split(" ")[0]}</span></div></td>
                  <td style={{padding:"10px 12px",fontWeight:500,color:"var(--text)"}}>{cl?.name}</td>
                  <td style={{padding:"10px 12px",color:"var(--text2)",fontSize:12}}>{equips.map(e=>`${e.name} ${e.model}`).join(", ")||"—"}</td>
                  <td style={{padding:"10px 12px",color:"var(--text2)",whiteSpace:"nowrap"}}>{trip.date}</td>
                  <td style={{padding:"10px 12px",fontWeight:700,color:"var(--text)"}}>{trip.km}</td>
                  <td style={{padding:"10px 12px",fontWeight:700,color:"var(--accent)"}}>L.{fmt(trip.reimbursement)}</td>
                  <td style={{padding:"10px 12px"}}><Badge type={trip.tripType}>{trip.tripType}</Badge></td>
                  <td style={{padding:"10px 12px"}}><Badge type={trip.status}>{trip.status}</Badge></td>
                  <td style={{padding:"10px 12px"}}><span style={{fontSize:12,color:"var(--accent)"}}>Ver mapa →</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── INVENTARIO ───────────────────────────────────────────────────────────────
function Inventario({inventory,onAdd}){
  const [show,setShow]=useState(false);
  const [f,setF]=useState({name:"",model:"",serial:"",category:"",stock:1,unitCost:0});
  const set=k=>v=>setF(p=>({...p,[k]:v}));
  const add=async()=>{
    if(!f.name||!f.model){alert("Nombre y modelo son requeridos");return;}
    await onAdd({...f,stock:+f.stock,unitCost:+f.unitCost});
    setF({name:"",model:"",serial:"",category:"",stock:1,unitCost:0});
    setShow(false);
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:12,color:"var(--text2)"}}>{inventory.length} artículos · <span style={{color:"#A32D2D"}}>{inventory.filter(e=>e.stock===0).length} sin stock</span> · <span style={{color:"#854F0B"}}>{inventory.filter(e=>e.stock===1).length} stock bajo</span></div>
        <Btn variant="primary" onClick={()=>setShow(true)}>+ Agregar equipo</Btn>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,overflow:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"var(--surface)"}}>{["Equipo","Modelo","N° Serie","Categoría","Stock","Costo unit. (L.)","Estado"].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",fontSize:11,color:"var(--text2)",fontWeight:600,borderBottom:"1px solid var(--border)",textTransform:"uppercase",letterSpacing:"0.04em"}}>{h}</th>)}</tr></thead>
          <tbody>
            {inventory.map((eq,i)=>{
              const st=eq.stock===0?"danger":eq.stock<=1?"warning":"success";
              const lb=eq.stock===0?"Sin stock":eq.stock<=1?"Stock bajo":"Disponible";
              return(
                <tr key={eq.id} style={{borderBottom:i<inventory.length-1?"1px solid var(--border)":"none"}} onMouseEnter={e=>e.currentTarget.style.background="var(--surface)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                  <td style={{padding:"10px 12px",fontWeight:700,color:"var(--text)"}}>{eq.name}</td>
                  <td style={{padding:"10px 12px",color:"var(--text2)"}}>{eq.model}</td>
                  <td style={{padding:"10px 12px",color:"var(--text2)",fontFamily:"'DM Mono',monospace",fontSize:11}}>{eq.serial}</td>
                  <td style={{padding:"10px 12px",color:"var(--text2)"}}>{eq.category}</td>
                  <td style={{padding:"10px 12px",fontWeight:700,color:eq.stock===0?"#A32D2D":eq.stock<=1?"#854F0B":"var(--text)"}}>{eq.stock}</td>
                  <td style={{padding:"10px 12px",color:"var(--text2)"}}>{fmt(eq.unitCost)}</td>
                  <td style={{padding:"10px 12px"}}><Badge type={st}>{lb}</Badge></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

function ReportModal({destIdx,client,arrivalTime,destType,user,onSave,onClose,tripId,selectedEquips=[],inventory=[]}){
  // Auto-fill from selected equipment
  const firstEquip=inventory.find(e=>selectedEquips.includes(e.id));
  const [marca,setMarca]=useState(firstEquip?.name||"");
  const [modelo,setModelo]=useState(firstEquip?.model||"");
  const [serie,setSerie]=useState(firstEquip?.serial||"");
  const [selectedEquipId,setSelectedEquipId]=useState(firstEquip?.id||"");
  const [condicion,setCondicion]=useState("");
  const [reparaciones,setReparaciones]=useState("");
  const [repuestos,setRepuestos]=useState("");
  const [calibracion,setCalibracion]=useState(null); // true/false/null
  const [controlCalidad,setControlCalidad]=useState(null);
  const [signed,setSigned]=useState(false);
  const [sigTime,setSigTime]=useState("");
  const [countdown,setCountdown]=useState(0);
  const canvasRef=useRef(null);
  const drawingRef=useRef(false);
  const sigLockedRef=useRef(false);

  const now=new Date();
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const fechaStr=`${dias[now.getDay()]}, ${now.getDate()} de ${meses[now.getMonth()]} de ${now.getFullYear()}`;
  
  // Report number comes from server after save — show placeholder until then
  const year=now.getFullYear();
  const month=String(now.getMonth()+1).padStart(2,"0");
  const [reportNum,setReportNum]=useState("LT-"+year+month+"-...");
  const [reportSaved,setReportSaved]=useState(false);

  const p2=d=>`${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;

  // Canvas drawing
  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas) return;
    const ctx=canvas.getContext("2d");
    ctx.strokeStyle="#0F6E56";
    ctx.lineWidth=2.2;
    ctx.lineCap="round";
    ctx.lineJoin="round";
  },[]);

  const getPos=(canvas,e)=>{
    const r=canvas.getBoundingClientRect();
    const scaleX=canvas.width/r.width;
    const scaleY=canvas.height/r.height;
    if(e.touches) return {x:(e.touches[0].clientX-r.left)*scaleX,y:(e.touches[0].clientY-r.top)*scaleY};
    return {x:(e.clientX-r.left)*scaleX,y:(e.clientY-r.top)*scaleY};
  };

  const startDraw=e=>{
    if(sigLockedRef.current) return; // locked after confirm
    e.preventDefault();
    drawingRef.current=true;
    const canvas=canvasRef.current;
    const ctx=canvas.getContext("2d");
    const p=getPos(canvas,e);
    ctx.beginPath();ctx.moveTo(p.x,p.y);
    if(!signed){
      const ts=p2(new Date());
      setSigned(true);setSigTime(ts);
    }
  };

  const draw=e=>{
    if(!drawingRef.current||sigLockedRef.current) return;
    e.preventDefault();
    const canvas=canvasRef.current;
    const ctx=canvas.getContext("2d");
    const p=getPos(canvas,e);
    ctx.lineTo(p.x,p.y);ctx.stroke();
  };

  const autoLockTimerRef=useRef(null);
  const endDraw=()=>{
    drawingRef.current=false;
    // Start 30-second countdown after user lifts finger
    if(signed&&!sigLockedRef.current){
      if(autoLockTimerRef.current) clearTimeout(autoLockTimerRef.current);
      setCountdown(30);
      autoLockTimerRef.current=setTimeout(()=>{
        // Auto-lock after 30 seconds of no movement
        sigLockedRef.current=true;
        const ts=p2(new Date());
        setSigTime(ts);
        setCountdown(0);
      },30000);
      // Countdown timer
      let c=30;
      const countInterval=setInterval(()=>{
        c--;
        setCountdown(c);
        if(c<=0) clearInterval(countInterval);
      },1000);
    }
  };

  const clearSig=()=>{
    const canvas=canvasRef.current;
    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    setSigned(false);setSigTime("");setCountdown(0);
    sigLockedRef.current=false;
    if(autoLockTimerRef.current) clearTimeout(autoLockTimerRef.current);
  };

  const handleSave=async()=>{
    const data={
      tripId,technicianId:user.id,clientId:client?.id,
      fecha:fechaStr,marca,modelo,serie,condicion,reparaciones,repuestos,
      calibracion,controlCalidad,
      horaLlegada:arrivalTime,horaSalida:sigTime||p2(new Date()),
      signed,sigTime,
      sigData:canvasRef.current?.toDataURL()||""
    };
    try{
      const res=await fetch("/api/reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
      const saved=await res.json();
      setReportNum(saved.reportNum||reportNum);
      setReportSaved(true);
      // Save reportId to link later when trip is saved
      onSave({...data,reportNum:saved.reportNum||reportNum,reportId:saved.id});
    }catch(e){console.error(e);onSave({...data,reportNum});}
  };

  const handleDownloadPDF=()=>{
    const reportHTML=`

            {[["Condición del equipo",condicion,setCondicion,"Estado del equipo al llegar...",64],["Reparaciones efectuadas",reparaciones,setReparaciones,"Describa las reparaciones...",80],["Repuestos utilizados",repuestos,setRepuestos,"Liste los repuestos...",56]].map(([l,v,s,ph,h])=>(

            </div>
          </div>

          {/* Firma */}
          <div style={{background:"var(--surface)",borderRadius:10,padding:"12px",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>✍️ Firma del cliente — <span style={{color:"#0F6E56",textTransform:"none"}}>registra hora de salida</span></div>
            <div style={{position:"relative",border:"1px dashed #0F6E56",borderRadius:10,overflow:"hidden",background:"white"}}>
              <canvas ref={canvasRef} width={640} height={140}
                style={{display:"block",width:"100%",height:140,cursor:signed?"default":"crosshair",touchAction:"none"}}
                onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={()=>{drawingRef.current=false;}}
                onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}
              />
              {!signed&&<div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontSize:12,color:"#aaa",pointerEvents:"none",display:"flex",alignItems:"center",gap:6}}>✏️ El cliente firma aquí</div>}
              {signed&&<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.03)",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:4,pointerEvents:"none"}}><div style={{fontSize:12,color:"#0F6E56",fontWeight:600}}>🔒 Firma registrada</div></div>}

                {signed&&!sigLockedRef.current&&<button onClick={()=>{if(autoLockTimerRef.current)clearTimeout(autoLockTimerRef.current);sigLockedRef.current=true;const ts=p2(new Date());setSigTime(ts);setCountdown(0);}} style={{fontSize:11,color:"white",background:"#0F6E56",border:"none",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontWeight:700}}>✓ Confirmar ahora</button>}

function AppEmpleado({user,trips,onSaveTrip,inventory,clients,rate,mapsKey,reports=[],fuelGasPrice=95,fuelDieselPrice=85}){
  const [tab,setTab]=useState("inicio");
  const [active,setActive]=useState(false);
  const [km,setKm]=useState(0);
  const [startTime,setStartTime]=useState(null);
  const [elapsed,setElapsed]=useState(0);
  // Destinations: [{clientId, equipIds, type, notes}]
  const defaultType=user?.role==="ventas"?"visita":user?.role==="technician"?"mantenimiento":"entrega";
  const [destinations,setDestinations]=useState([{clientId:"",equipIds:[],type:user?.role==="ventas"?"visita":"mantenimiento",notes:""}]);
  const [gpsPts,setGpsPts]=useState([]);
  const [gpsError,setGpsError]=useState("");
  const [currentDestIdx,setCurrentDestIdx]=useState(0);
  const [destTimers,setDestTimers]=useState({}); // {idx: {arrival, arrivalStr, departure, departureStr, elapsed}}
  const [atDest,setAtDest]=useState(false);
  const [reportModal,setReportModal]=useState(null); // {destIdx, client, arrivalTime}
  const [reportData,setReportData]=useState({}); // keyed by destIdx
  const [lastReportId,setLastReportId]=useState(null);
  const [lastReportNum,setLastReportNum]=useState(null);
  const [orderMode,setOrderMode]=useState(null); // null | "ask" | "manual" | "auto_ask" | "done"
  const [orderedDests,setOrderedDests]=useState([]);
  const watchRef=useRef(null);
  const timerRef=useRef(null);
  const destTimerRef=useRef(null);
  const wakeLockRef=useRef(null);
  const reportIdRef=useRef(null);
  const reportNumRef=useRef(null);
  const myTrips=trips.filter(t=>t.technicianId===user.id);
  const initials=user.name.split(" ").map(w=>w[0]).join("").slice(0,2);
  const thisMonth=new Date().toISOString().slice(0,7);
  const monthTrips=myTrips.filter(t=>t.date.startsWith(thisMonth));
  const pendingAmt=myTrips.filter(t=>t.status==="pendiente").reduce((s,t)=>s+t.reimbursement,0);

  // Haversine distance
  const calcDist=([lat1,lon1],[lat2,lon2])=>{
    const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  };

  // Distance between two clients using their coordinates
  const clientDist=(c1,c2)=>{
    if(!c1?.lat||!c2?.lat) return 9999;
    return calcDist([c1.lat,c1.lng],[c2.lat,c2.lng]);
  };

  // Sort destinations by distance (nearest first or farthest first)
  const sortDestinations=(mode)=>{
    const validDests=destinations.filter(d=>d.clientId);
    if(validDests.length<2){setOrderMode("done");return;}
    const OFFICE={lat:14.0999,lng:-87.2062}; // Tegucigalpa office approx
    const withDist=validDests.map(d=>{
      const cl=clients.find(c=>c.id===d.clientId);
      const dist=cl?.lat?calcDist([OFFICE.lat,OFFICE.lng],[cl.lat,cl.lng]):9999;
      return {...d,dist};
    });
    let sorted;
    if(mode==="near_far") sorted=withDist.sort((a,b)=>a.dist-b.dist);
    else sorted=withDist.sort((a,b)=>b.dist-a.dist); // far_near
    setDestinations(sorted.map(({dist,...d})=>d));
    setOrderMode("done");
  };

  // Open Google Maps with all destinations in order
  const openGoogleMaps=(fromIdx=0,userLat=null,userLng=null)=>{
    const validDests=destinations.filter(d=>d.clientId);
    if(validDests.length===0) return;
    const dest=validDests[fromIdx];
    const cl=clients.find(c=>c.id===dest?.clientId);
    if(!cl) return;
    // Use current GPS location as origin if available
    const originStr=userLat&&userLng
      ?`${userLat},${userLng}`
      :""; // Empty = Google Maps uses current location
    const remaining=validDests.slice(fromIdx+1);
    if(remaining.length===0){
      const destStr=cl.lat?`${cl.lat},${cl.lng}`:encodeURIComponent(`${cl.name} ${cl.city} Honduras`);
      const url=`https://www.google.com/maps/dir/?api=1${originStr?`&origin=${originStr}`:""}&destination=${destStr}&travelmode=driving`;
      window.open(url,'_blank');
    } else {
      const waypoints=remaining.slice(0,-1).map(d=>{
        const c=clients.find(cl=>cl.id===d.clientId);
        return c?.lat?`${c.lat},${c.lng}`:encodeURIComponent(`${c?.name} ${c?.city} Honduras`);
      });
      const finalDest=remaining[remaining.length-1];
      const finalCl=clients.find(c=>c.id===finalDest.clientId);
      const destStr=finalCl?.lat?`${finalCl.lat},${finalCl.lng}`:encodeURIComponent(`${finalCl?.name} ${finalCl?.city} Honduras`);
      const waypointStr=waypoints.length>0?`&waypoints=${waypoints.join("|")}`:"";
      const url=`https://www.google.com/maps/dir/?api=1${originStr?`&origin=${originStr}`:""}&destination=${destStr}${waypointStr}&travelmode=driving`;
      window.open(url,'_blank');
    }
  };

  // GPS tracking
  useEffect(()=>{
    if(active){
      timerRef.current=setInterval(()=>setElapsed(e=>e+1),1000);
      if(!navigator.geolocation){setGpsError("Tu dispositivo no soporta GPS");return;}
      setGpsError("");
      watchRef.current=navigator.geolocation.watchPosition(
        pos=>{
          const newPt=[pos.coords.latitude,pos.coords.longitude];
          setGpsPts(prev=>{
            if(prev.length===0) return [newPt];
            const dist=calcDist(prev[prev.length-1],newPt);
            if(dist>0.05){setKm(k=>+(k+dist).toFixed(2));return [...prev,newPt];}
            return prev;
          });
        },
        err=>{setGpsError(err.code===1?"Permiso denegado":"Error GPS");},
        {enableHighAccuracy:true,maximumAge:5000,timeout:15000}
      );
      // WakeLock to keep screen on
      if('wakeLock' in navigator){
        navigator.wakeLock.request('screen').then(lock=>{wakeLockRef.current=lock;}).catch(()=>{});
      }
    } else {
      clearInterval(timerRef.current);
      if(watchRef.current) navigator.geolocation.clearWatch(watchRef.current);
      if(wakeLockRef.current){wakeLockRef.current.release();wakeLockRef.current=null;}
    }
    return()=>{
      clearInterval(timerRef.current);
      if(watchRef.current) navigator.geolocation.clearWatch(watchRef.current);
    };
  },[active]);

  const addDestination=()=>{
    const defaultType=user.role==="ventas"?"visita":user.role==="technician"?"mantenimiento":"entrega";
    setDestinations(prev=>[...prev,{clientId:"",equipIds:[],type:defaultType,notes:""}]);
  };
  const removeDestination=idx=>{
    if(destinations.length===1) return;
    setDestinations(prev=>prev.filter((_,i)=>i!==idx));
  };
  const updateDest=(idx,key,val)=>setDestinations(prev=>prev.map((d,i)=>i===idx?{...d,[key]:val}:d));
  const toggleDestEquip=(idx,eqId)=>setDestinations(prev=>prev.map((d,i)=>{
    if(i!==idx) return d;
    const equipIds=d.equipIds.includes(eqId)?d.equipIds.filter(e=>e!==eqId):[...d.equipIds,eqId];
    return {...d,equipIds};
  }));

  const start=()=>{
    const valid=destinations.filter(d=>d.clientId);
    if(valid.length===0){alert("Agrega al menos un destino");return;}
    // Ask about order if multiple destinations
    if(valid.length>1&&orderMode!=="done"){
      setOrderMode("ask");
      return;
    }
    setActive(true);setKm(0);setElapsed(0);setGpsPts([]);
    setCurrentDestIdx(0);setStartTime(new Date());setTab("activo");
    // Open Maps for first destination
    openGoogleMaps(0);
  };

  const arriveAtDest=idx=>{
    const now=new Date();
    const p2=d=>`${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;
    setDestTimers(prev=>({...prev,[idx]:{arrival:now,arrivalStr:p2(now),elapsed:0}}));
    setAtDest(true);
    destTimerRef.current=setInterval(()=>{
      setDestTimers(prev=>({...prev,[idx]:{...prev[idx],elapsed:(prev[idx]?.elapsed||0)+1}}));
    },1000);
  };

  const departFromDest=idx=>{
    // Show report modal before departing
    const cl=clients.find(c=>c.id===destinations.filter(d=>d.clientId)[idx]?.clientId);
    const timer=destTimers[idx];
    const destInfo=destinations.filter(d=>d.clientId)[idx];
    setReportModal({destIdx:idx,client:cl,arrivalTime:timer?.arrivalStr||"",destType:destInfo?.type,equipIds:destInfo?.equipIds||[],tripId:"trip_"+Date.now()});
  };

  const confirmDepart=idx=>{
    clearInterval(destTimerRef.current);
    const now=new Date();
    const p2=d=>`${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;
    setDestTimers(prev=>({...prev,[idx]:{...prev[idx],departure:now,departureStr:p2(now)}}));
    setAtDest(false);
    setReportModal(null);
    const nextIdx=idx+1;
    const validDests=destinations.filter(d=>d.clientId);
    setCurrentDestIdx(nextIdx);
    // If there's a next destination, open Maps
    if(nextIdx<validDests.length){
      navigator.geolocation?.getCurrentPosition(
        pos=>openGoogleMaps(nextIdx,pos.coords.latitude,pos.coords.longitude),
        ()=>openGoogleMaps(nextIdx)
      );
    }
  };

  const end=async()=>{

    // Use lastReportId as fallback
    const finalReportId=reportIdRef.current||lastReportId||firstReport?.reportId||null;
    const finalReportNum=reportNumRef.current||lastReportNum||firstReport?.reportNum||null;
    console.log("Linking report:", finalReportId, "to trip");

      technicianId:user.id,clientId:mainDest?.clientId||validDests[0]?.clientId,
      date:now.toISOString().slice(0,10),
      tripType:validDests[0]?.type||"entrega",
      equipmentIds:allEquipIds,
      origin:{lat:firstPt?.[0]||0,lng:firstPt?.[1]||0,label:"Punto de origen"},

      startTime:p2(startTime||now),endTime:p2(now),
      km:finalKm,reimbursement:0, // Server calculates based on fuel
      notes:validDests.map(d=>d.notes).filter(Boolean).join(" | ")||"Viaje completado.",
      reportId:finalReportId,
      reportNum:finalReportNum
    });
    setKm(0);setDestinations([{clientId:"",equipIds:[],type:"entrega",notes:""}]);
    setGpsPts([]);setElapsed(0);setDestTimers({});setCurrentDestIdx(0);setLastReportId(null);setLastReportNum(null);setReportData({});reportIdRef.current=null;reportNumRef.current=null;
    setAtDest(false);setOrderMode(null);setStartTime(null);
    setTab("historial");
  };

  const mins=Math.floor(elapsed/60),secs=elapsed%60;
  const rendEmp=+(user?.rendimiento||12);
  const fuelPriceEmp=user?.tipoCombustible==="diesel"?fuelDieselPrice:fuelGasPrice;

          </div>

          <div style={{padding:14,overflowY:"auto",maxHeight:520}}>

            {/* ── INICIO ── */}
            {tab==="inicio"&&(
              <div>
                <div style={{background:"linear-gradient(135deg,#E6F1FB,#EEEDFE)",borderRadius:12,padding:"14px 16px",marginBottom:14}}>

                  </div>
                  <div style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px"}}>
                    <div style={{fontSize:10,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.04em"}}>Pendiente</div>

                  </div>
                </div>
                <button onClick={()=>setTab("viaje")} style={{width:"100%",background:"linear-gradient(135deg,#0F6E56,#1D9E75)",color:"white",border:"none",borderRadius:14,padding:"16px",fontSize:15,fontWeight:800,cursor:"pointer",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>

                    </div>

                })}
              </div>
            )}

            {/* ── PLANIFICAR ── */}
            {tab==="viaje"&&!active&&orderMode===null&&(

                            <span style={{fontSize:11,color:"var(--text)"}}>{eq.name} {eq.model}</span>

                <button onClick={start} style={{width:"100%",background:"#185FA5",color:"white",border:"none",borderRadius:14,padding:"14px",fontSize:14,fontWeight:800,cursor:"pointer"}}>

                  <button onClick={()=>setOrderMode("manual")} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",textAlign:"left",cursor:"pointer"}}>
                    <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>📍 Manual</div>
                    <div style={{fontSize:12,color:"var(--text2)",marginTop:3}}>Yo decido el orden de los destinos</div>
                  </button>
                  <button onClick={()=>setOrderMode("auto_ask")} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",textAlign:"left",cursor:"pointer"}}>

                  </button>

                  </button>
                  <button onClick={()=>sortDestinations("near_far")} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",textAlign:"left",cursor:"pointer"}}>
                    <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>🏠 De cerca a lejos</div>
                    <div style={{fontSize:12,color:"var(--text2)",marginTop:3}}>Empieza por los más cercanos primero</div>
                  </button>
                </div>
                <button onClick={()=>setOrderMode("ask")} style={{marginTop:12,background:"none",border:"none",cursor:"pointer",color:"var(--text2)",fontSize:13,textDecoration:"underline"}}>← Volver</button>
              </div>

            {/* ── MANUAL ORDER ── */}
            {orderMode==="manual"&&(

                        <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{cl?.name||"—"}</div>
                        <div style={{fontSize:11,color:"var(--text2)"}}>{cl?.city}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:2}}>
                        {idx>0&&<button onClick={()=>{const d=[...destinations.filter(x=>x.clientId)];[d[idx-1],d[idx]]=[d[idx],d[idx-1]];setDestinations(d);}} style={{background:"var(--border)",border:"none",borderRadius:4,cursor:"pointer",padding:"2px 6px",fontSize:12}}>↑</button>}
                        {idx<arr.length-1&&<button onClick={()=>{const d=[...destinations.filter(x=>x.clientId)];[d[idx],d[idx+1]]=[d[idx+1],d[idx]];setDestinations(d);}} style={{background:"var(--border)",border:"none",borderRadius:4,cursor:"pointer",padding:"2px 6px",fontSize:12}}>↓</button>}

              </div>

            {orderMode==="done"&&(
              <div style={{padding:"8px 0"}}>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:12}}>✓ Orden confirmado</div>
                {destinations.filter(d=>d.clientId).map((dest,idx)=>{
                  const cl=clients.find(c=>c.id===dest.clientId);
                  return(
                    <div key={idx} style={{background:"var(--surface)",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:26,height:26,borderRadius:"50%",background:"#185FA5",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{idx+1}</div>

            {tab==="activo"&&active&&(
              <div>
                <div style={{background:gpsError?"#FCEBEB":"#E1F5EE",borderRadius:10,padding:"10px 13px",marginBottom:10,display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:gpsError?"#A32D2D":"#1D9E75",flexShrink:0,boxShadow:gpsError?"none":"0 0 0 3px rgba(29,158,117,.25)"}}/>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:gpsError?"#A32D2D":"#085041"}}>{gpsError?"Error GPS":"GPS activo · pantalla encendida"}</div>

                {reports.filter(r=>r.technicianId===user.id).length===0&&<div style={{color:"var(--text2)",fontSize:13,padding:"20px 0",textAlign:"center"}}>Sin reportes aún</div>}
                {reports.filter(r=>r.technicianId===user.id).map(rep=>{
                  const cl=clients.find(c=>c.id===rep.clientId);
                  return(
                    <div key={rep.id} style={{background:"var(--surface)",borderRadius:10,padding:"11px 13px",marginBottom:8,border:"1px solid var(--border)"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:12,fontWeight:700,color:"#0F6E56",fontFamily:"monospace",marginBottom:2}}>{rep.reportNum}</div>
                          <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{cl?.name||"—"}</div>
                          <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>{rep.fecha} · {rep.horaLlegada}–{rep.horaSalida}</div>
                          {(rep.marca||rep.modelo)&&<div style={{fontSize:11,color:"var(--text2)",marginTop:1}}>🔧 {[rep.marca,rep.modelo].filter(Boolean).join(" ")}</div>}
                        </div>
                        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                          <span style={{fontSize:18}}>{rep.signed?"✅":"⏳"}</span>
                          <button onClick={()=>window.open(`/api/reports/${rep.id}/pdf`,"_blank")} style={{background:"#0F6E56",color:"white",border:"none",borderRadius:6,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>📄 PDF</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* ── HISTORIAL ── */}
            {tab==="historial"&&(
              <div>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:12}}>Mis viajes ({myTrips.length})</div>
                {myTrips.length===0&&<div style={{color:"var(--text2)",fontSize:13,padding:"20px 0",textAlign:"center"}}>Sin viajes aún</div>}
                {myTrips.map(t=>{
                  const cl=clients.find(c=>c.id===t.clientId);
                  return(
                    <div key={t.id} style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px",marginBottom:8}}>
                      <div style={{display:"flex",justifyContent:"space-between"}}>
                        <div>
                          <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{cl?.name||"—"}</div>
                          <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>{t.date} · {t.km} km · {t.tripType}</div>
                          {(t.stops||[]).length>0&&<div style={{fontSize:11,color:"#854F0B",marginTop:1}}>📍 {t.stops.length} destino{t.stops.length!==1?"s":""} en el camino</div>}
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontWeight:800,fontSize:13,color:"#185FA5"}}>L.{fmt(t.reimbursement)}</div>
                          <div style={{marginTop:3}}><Badge type={t.status}>{t.status}</Badge></div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* ── PERFIL ── */}
            {tab==="perfil"&&(
              <div style={{padding:"8px 0"}}>
                <div style={{textAlign:"center",padding:"16px 0 20px"}}>
                  <Avatar initials={initials} color={user.color} size={68}/>
                  <div style={{fontWeight:800,fontSize:17,color:"var(--text)",marginTop:12}}>{user.name}</div>
                  <div style={{fontSize:13,color:"var(--text2)",marginTop:4}}>{user.email}</div>
                  <div style={{fontSize:12,background:"#E6F1FB",color:"#185FA5",display:"inline-block",padding:"3px 12px",borderRadius:20,marginTop:6,fontWeight:600}}>{user.role==="admin"?"Administrador":"Técnico"}</div>
                </div>
                <div style={{background:"var(--surface)",borderRadius:12,padding:14}}>
                  {[["Total viajes",myTrips.length],["Total km",`${myTrips.reduce((s,t)=>s+t.km,0)} km`],["Este mes",`${monthTrips.length} viajes`],["Pendiente",`L.${fmt(pendingAmt)}`],["Reembolsado",`L.${fmt(myTrips.filter(t=>t.status==="reembolsado").reduce((s,t)=>s+t.reimbursement,0))}`]].map(([l,v],i,a)=>(
                    <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:i<a.length-1?"1px solid var(--border)":"none",fontSize:13}}><span style={{color:"var(--text2)"}}>{l}</span><span style={{fontWeight:700,color:"var(--text)"}}>{v}</span></div>
                  ))}
                </div>
              </div>
            )}

          </div>

          {/* Report Modal */}
          {reportModal&&<ReportModal
            destIdx={reportModal.destIdx}
            client={reportModal.client}
            arrivalTime={reportModal.arrivalTime}
            destType={reportModal.destType}
            user={user}
            tripId={reportModal.tripId}
            selectedEquips={reportModal.equipIds||[]}
            inventory={inventory}
            onSave={(data)=>{
              setReportData(prev=>({...prev,[reportModal.destIdx]:data}));
              if(data.reportId){setLastReportId(data.reportId);reportIdRef.current=data.reportId;}
              if(data.reportNum){setLastReportNum(data.reportNum);reportNumRef.current=data.reportNum;}
              confirmDepart(reportModal.destIdx);
            }}
            onClose={()=>setReportModal(null)}
          />}

          {/* Tab bar */}
          <div style={{display:"flex",borderTop:"1px solid var(--border)",padding:"8px 0 6px",background:"var(--card)"}}>
            {[{k:"inicio",i:"🏠",l:"Inicio"},{k:"viaje",i:"🚗",l:"Viaje"},{k:"reportes_emp",i:"📄",l:"Reportes"},{k:"historial",i:"📋",l:"Historial"},{k:"perfil",i:"👤",l:"Perfil"}].map(t=>(
              <button key={t.k} onClick={()=>{
                if(t.k==="viaje"&&active){setTab("activo");return;}
                if(t.k!=="inicio"&&t.k!=="historial"&&t.k!=="perfil") return;
                setTab(t.k);
              }} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 0",color:(tab===t.k||(t.k==="viaje"&&(tab==="activo"||tab==="viaje"||orderMode!==null)))?"#185FA5":"var(--text2)"}}>
                <span style={{fontSize:20}}>{t.i}</span>
                <span style={{fontSize:9,fontWeight:(tab===t.k||(t.k==="viaje"&&(tab==="activo"||tab==="viaje"||orderMode!==null)))?700:400}}>{t.l}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

        <div style={{display:"flex",justifyContent:"flex-end",marginTop:10}}><Btn variant="primary" onClick={()=>{onSaveFuelPrices(fuelGasPrice,fuelDieselPrice);}}>Guardar precios</Btn></div>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:8}}>Acerca de LabTrack</div>
        <div style={{fontSize:13,color:"var(--text2)",lineHeight:1.8}}>Versión 2.0 · Plataforma de operaciones de campo<br/>Diseñado para empresas de equipos de laboratorio en Honduras 🇭🇳<br/><br/><span style={{color:"#1D9E75",fontWeight:600}}>✓ Conectado a base de datos en vivo</span></div>
