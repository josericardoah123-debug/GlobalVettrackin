  const [destinations,setDestinations]=useState([{clientId:"",equipIds:[],type:user?.role==="ventas"?"visita":"mantenimiento",notes:""}]);
  const [gpsPts,setGpsPts]=useState([]);
  const [gpsError,setGpsError]=useState("");
  const [currentDestIdx,setCurrentDestIdx]=useState(0);
  const [destTimers,setDestTimers]=useState({}); // {idx: {arrival, arrivalStr, departure, departureStr, elapsed}}
  const [atDest,setAtDest]=useState(false);
  const [reportModal,setReportModal]=useState(null); // {destIdx, client, arrivalTime}
  const [reportData,setReportData]=useState({}); // keyed by destIdx
  const [lastReportId,setLastReportId]=useState(null);
  const [lastReportNum,setLastReportNum]=useState(null);
  const [orderMode,setOrderMode]=useState(null); // null | "ask" | "manual" | "auto_ask" | "done"
  const [orderedDests,setOrderedDests]=useState([]);
  const watchRef=useRef(null);
  const timerRef=useRef(null);
  const destTimerRef=useRef(null);
  const wakeLockRef=useRef(null);
  const reportIdRef=useRef(null);
  const reportNumRef=useRef(null);
  const myTrips=trips.filter(t=>t.technicianId===user.id);
  const initials=user.name.split(" ").map(w=>w[0]).join("").slice(0,2);
  const thisMonth=new Date().toISOString().slice(0,7);
  const monthTrips=myTrips.filter(t=>t.date.startsWith(thisMonth));
  const pendingAmt=myTrips.filter(t=>t.status==="pendiente").reduce((s,t)=>s+t.reimbursement,0);

  // Haversine distance
  const calcDist=([lat1,lon1],[lat2,lon2])=>{
    const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  };

  // Distance between two clients using their coordinates
  const clientDist=(c1,c2)=>{
    if(!c1?.lat||!c2?.lat) return 9999;
    return calcDist([c1.lat,c1.lng],[c2.lat,c2.lng]);
  };

  // Sort destinations by distance (nearest first or farthest first)
  const sortDestinations=(mode)=>{
    const validDests=destinations.filter(d=>d.clientId||d.mandadoPlace);
    if(validDests.length<2){setOrderMode("done");return;}
    const OFFICE={lat:14.0999,lng:-87.2062}; // Tegucigalpa office approx
    const withDist=validDests.map(d=>{
      const cl=clients.find(c=>c.id===d.clientId);
      const dist=cl?.lat?calcDist([OFFICE.lat,OFFICE.lng],[cl.lat,cl.lng]):9999;
      return {...d,dist};
    });
    let sorted;
    if(mode==="near_far") sorted=withDist.sort((a,b)=>a.dist-b.dist);
    else sorted=withDist.sort((a,b)=>b.dist-a.dist); // far_near
    setDestinations(sorted.map(({dist,...d})=>d));
    setOrderMode("done");
  };

  // Open Google Maps with all destinations in order
  const openGoogleMaps=(fromIdx=0,userLat=null,userLng=null)=>{
    const validDests=destinations.filter(d=>d.clientId||d.mandadoPlace);
    if(validDests.length===0) return;
    const dest=validDests[fromIdx];
    const cl=dest?.type==="mandado"?null:clients.find(c=>c.id===dest?.clientId);
    const destCoords=dest?.type==="mandado"?dest.mandadoPlace:cl;
    // If client has no coords, search by name in Google Maps
    if(!destCoords?.lat&&cl&&mapsKey){
      const searchQuery=encodeURIComponent(`${cl.name} ${cl.city} Honduras`);
      const url=`https://www.google.com/maps/search/${searchQuery}`;
      window.open(url,"_blank");
      return;
    }
    if(!destCoords&&!cl) return;
    // Use current GPS location as origin if available
    const originStr=userLat&&userLng
      ?`${userLat},${userLng}`
      :""; // Empty = Google Maps uses current location
    const remaining=validDests.slice(fromIdx+1);
    if(remaining.length===0){
      const dc=dest?.type==="mandado"?dest.mandadoPlace:cl;
      const destStr=dc?.lat?`${dc.lat},${dc.lng}`:encodeURIComponent(`${dc?.name||""} ${dc?.city||""} Honduras`);
      const url=`https://www.google.com/maps/dir/?api=1${originStr?`&origin=${originStr}`:""}&destination=${destStr}&travelmode=driving`;
      window.open(url,'_blank');
    } else {
      const waypoints=remaining.slice(0,-1).map(d=>{
        const c=clients.find(cl=>cl.id===d.clientId);
        return c?.lat?`${c.lat},${c.lng}`:encodeURIComponent(`${c?.name} ${c?.city} Honduras`);
      });
      const finalDest=remaining[remaining.length-1];
      const finalCl=clients.find(c=>c.id===finalDest.clientId);
      const destStr=finalCl?.lat?`${finalCl.lat},${finalCl.lng}`:encodeURIComponent(`${finalCl?.name} ${finalCl?.city} Honduras`);
      const waypointStr=waypoints.length>0?`&waypoints=${waypoints.join("|")}`:"";
      const url=`https://www.google.com/maps/dir/?api=1${originStr?`&origin=${originStr}`:""}&destination=${destStr}${waypointStr}&travelmode=driving`;
      window.open(url,'_blank');
    }
  };

  // GPS tracking
  useEffect(()=>{
    if(active){
      timerRef.current=setInterval(()=>setElapsed(e=>e+1),1000);
      if(!navigator.geolocation){setGpsError("Tu dispositivo no soporta GPS");return;}
      setGpsError("");
      watchRef.current=navigator.geolocation.watchPosition(
        pos=>{
          const newPt=[pos.coords.latitude,pos.coords.longitude];
          // Only accept if accuracy is reasonable
          if(pos.coords.accuracy>100) return;
          setGpsPts(prev=>{
            if(prev.length===0) return [newPt];
            const dist=calcDist(prev[prev.length-1],newPt);
            // Ignore spikes > 2km between consecutive points (GPS error)
            if(dist>2) return prev;
            if(dist>0.05){setKm(k=>+(k+dist).toFixed(2));return [...prev,newPt];}
            return prev;
          });
          // Send live position to server every update
          const validDests=destinations.filter(d=>d.clientId||d.mandadoPlace);
          const currentDest=validDests[currentDestIdx]||validDests[0];
          const cl=currentDest?.type==="mandado"?null:clients.find(c=>c.id===currentDest?.clientId);
          const destNameLive=currentDest?.type==="mandado"?(currentDest.mandadoName||"Mandado"):cl?.name||"";
          fetch("/api/gps/update",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              technicianId:user.id,
              lat:pos.coords.latitude,
              lng:pos.coords.longitude,
              km:km,
              destName:destNameLive,
              clientName:destNameLive,
              tripType:currentDest?.type||""
            })
          }).catch(()=>{});
        },
        err=>{setGpsError(err.code===1?"Permiso denegado":"Error GPS");},
        {enableHighAccuracy:true,maximumAge:5000,timeout:15000}
      );
      // WakeLock to keep screen on
      if('wakeLock' in navigator){
        navigator.wakeLock.request('screen').then(lock=>{wakeLockRef.current=lock;}).catch(()=>{});
      }
    } else {
      clearInterval(timerRef.current);
      if(watchRef.current) navigator.geolocation.clearWatch(watchRef.current);
      if(wakeLockRef.current){wakeLockRef.current.release();wakeLockRef.current=null;}
    }
    return()=>{
      clearInterval(timerRef.current);
      if(watchRef.current) navigator.geolocation.clearWatch(watchRef.current);
    };
  },[active]);

  const addDestination=()=>{
    const defaultType=user.role==="ventas"?"visita":user.role==="technician"?"mantenimiento":"entrega";
    setDestinations(prev=>[...prev,{clientId:"",equipIds:[],type:defaultType,notes:""}]);
  };
  const removeDestination=idx=>{
    if(destinations.length===1) return;
    setDestinations(prev=>prev.filter((_,i)=>i!==idx));
  };
  const updateDest=(idx,key,val)=>setDestinations(prev=>prev.map((d,i)=>i===idx?{...d,[key]:val}:d));
  const toggleDestEquip=(idx,eqId)=>setDestinations(prev=>prev.map((d,i)=>{
    if(i!==idx) return d;
    const equipIds=d.equipIds.includes(eqId)?d.equipIds.filter(e=>e!==eqId):[...d.equipIds,eqId];
    return {...d,equipIds};
  }));

  const start=()=>{
    const valid=destinations.filter(d=>d.clientId);
    if(valid.length===0){alert("Agrega al menos un destino");return;}
    // Ask about order if multiple destinations
    if(valid.length>1&&orderMode!=="done"){
      setOrderMode("ask");
      return;
    }
    setActive(true);setKm(0);setElapsed(0);setGpsPts([]);
    setCurrentDestIdx(0);setStartTime(new Date());setTab("activo");
    // Open Maps for first destination
    openGoogleMaps(0);
  };

  const arriveAtDest=idx=>{
    const now=new Date();
    const p2=d=>`${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;
    // Get current GPS position at arrival
    const gpsPos=gpsPts.length>0?gpsPts[gpsPts.length-1]:null;
    setDestTimers(prev=>({...prev,[idx]:{arrival:now,arrivalStr:p2(now),elapsed:0,arrivalGpsLat:gpsPos?.[0]||null,arrivalGpsLng:gpsPos?.[1]||null}}));
    setAtDest(true);
    destTimerRef.current=setInterval(()=>{
      setDestTimers(prev=>({...prev,[idx]:{...prev[idx],elapsed:(prev[idx]?.elapsed||0)+1}}));
    },1000);
  };

  const departFromDest=idx=>{
    // Show report modal before departing
    const cl=clients.find(c=>c.id===destinations.filter(d=>d.clientId)[idx]?.clientId);
    const timer=destTimers[idx];
    const destInfo=destinations.filter(d=>d.clientId)[idx];
    setReportModal({destIdx:idx,client:cl,arrivalTime:timer?.arrivalStr||"",destType:destInfo?.type,equipIds:destInfo?.equipIds||[],tripId:"trip_"+Date.now()});
  };

  const confirmDepart=idx=>{
    clearInterval(destTimerRef.current);
    const now=new Date();
    const p2=d=>`${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;
    setDestTimers(prev=>({...prev,[idx]:{...prev[idx],departure:now,departureStr:p2(now)}}));
    setAtDest(false);
    setReportModal(null);
    const nextIdx=idx+1;
    const validDests=destinations.filter(d=>d.clientId||d.mandadoPlace);
    setCurrentDestIdx(nextIdx);
    // If there's a next destination, open Maps
    if(nextIdx<validDests.length){
      navigator.geolocation?.getCurrentPosition(
        pos=>openGoogleMaps(nextIdx,pos.coords.latitude,pos.coords.longitude),
        ()=>openGoogleMaps(nextIdx)
      );
    }
  };

  const end=async()=>{
    setActive(false);
    clearInterval(destTimerRef.current);
    const now=new Date();
    const p2=d=>`${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;
    const validDests=destinations.filter(d=>d.clientId||d.mandadoPlace);
    const mainDest=validDests[validDests.length-1]; // last = main destination
    const client=clients.find(c=>c.id===mainDest?.clientId);
    const finalKm=+km.toFixed(1)||1;
    const firstPt=gpsPts[0]||null;
    const lastPt=gpsPts[gpsPts.length-1]||null;
    const tripStops=validDests.slice(0,-1).map((d,i)=>{
      const cl=d.type==="mandado"?null:clients.find(c=>c.id===d.clientId);
      const timer=destTimers[i]||{};
      // Use GPS position at arrival time if available, else client coords
      const stopLat=timer.arrivalGpsLat||cl?.lat||0;
      const stopLng=timer.arrivalGpsLng||cl?.lng||0;
      const stopName=d.type==="mandado"?(d.mandadoName||"Mandado"):`${cl?.name||"Destino"} — ${cl?.city||""}`;
      return {
        label:stopName,
        time:timer.arrivalStr||"",departureTime:timer.departureStr||"",
        timeSpent:timer.elapsed?Math.round(timer.elapsed/60)+" min":"",
        lat:stopLat,lng:stopLng
      };
    });
    const allEquipIds=[...new Set(validDests.flatMap(d=>d.equipIds))];
    // Collect all report IDs from this trip
    const tripReports=Object.values(reportData);
    const firstReport=tripReports[0];
    // Use lastReportId as fallback
    const finalReportId=reportIdRef.current||lastReportId||firstReport?.reportId||null;
    const finalReportNum=reportNumRef.current||lastReportNum||firstReport?.reportNum||null;
    console.log("Linking report:", finalReportId, "to trip");
    const savedTrip=await onSaveTrip({
      technicianId:user.id,clientId:mainDest?.clientId||validDests[0]?.clientId,
      date:now.toISOString().slice(0,10),
      tripType:validDests[0]?.type||"entrega",
      equipmentIds:allEquipIds,
      origin:{lat:firstPt?.[0]||0,lng:firstPt?.[1]||0,label:"Punto de origen"},
      destination:{lat:client?.lat||lastPt?.[0]||0,lng:client?.lng||lastPt?.[1]||0,label:client?`${client.name}, ${client.city}`:"Destino"},
      stops:tripStops,routePoints:gpsPts,
      startTime:p2(startTime||now),endTime:p2(now),
      km:finalKm,reimbursement:0, // Server calculates based on fuel
      notes:validDests.map(d=>d.notes).filter(Boolean).join(" | ")||"Viaje completado.",
      reportId:finalReportId,
      reportNum:finalReportNum
    });
    setKm(0);setDestinations([{clientId:"",equipIds:[],type:"entrega",notes:""}]);
    setGpsPts([]);setElapsed(0);setDestTimers({});setCurrentDestIdx(0);setLastReportId(null);setLastReportNum(null);setReportData({});reportIdRef.current=null;reportNumRef.current=null;
    // Clear live position
    fetch("/api/gps/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({technicianId:user.id})}).catch(()=>{});
    setAtDest(false);setOrderMode(null);setStartTime(null);
    setTab("historial");
  };

  const mins=Math.floor(elapsed/60),secs=elapsed%60;
  const rendEmp=+(user?.rendimiento||12);
  const fuelPriceEmp=user?.tipoCombustible==="diesel"?fuelDieselPrice:fuelGasPrice;
  const reimb=+((km/rendEmp)*fuelPriceEmp).toFixed(2);
  const hora=new Date().getHours();
  const validDests=destinations.filter(d=>d.clientId||d.mandadoPlace);

  return(
    <div style={{maxWidth:400,margin:"0 auto"}}>
      <div style={{background:"var(--surface)",borderRadius:28,padding:8,border:"1px solid var(--border)"}}>
        <div style={{background:"var(--card)",borderRadius:22,overflow:"hidden",minHeight:620}}>
          {/* Header */}
          <div style={{background:"linear-gradient(135deg,#0C447C,#185FA5)",padding:"18px 18px 14px"}}>
            <div style={{fontSize:18,fontWeight:800,color:"white",letterSpacing:"-0.5px"}}>Servvoo</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.75)",marginTop:1}}>{user.name} · {user.role==="admin"?"Admin":"Técnico"}</div>
          </div>

          <div style={{padding:14,overflowY:"auto",maxHeight:520}}>

            {/* ── INICIO ── */}
            {tab==="inicio"&&(
              <div>
                <div style={{background:"linear-gradient(135deg,#E6F1FB,#EEEDFE)",borderRadius:12,padding:"14px 16px",marginBottom:14}}>
                  <div style={{fontSize:15,fontWeight:700,color:"#0C447C"}}>{hora<12?"¡Buenos días":hora<18?"¡Buenas tardes":"¡Buenas noches"}, {user.name.split(" ")[0]}! 👋</div>
                  <div style={{fontSize:12,color:"#185FA5",marginTop:3}}>Listo para tu próximo viaje</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
                  <div style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px"}}>
                    <div style={{fontSize:10,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.04em"}}>Km este mes</div>
                    <div style={{fontSize:22,fontWeight:800,color:"var(--text)",marginTop:3}}>{monthTrips.reduce((s,t)=>s+t.km,0).toFixed(0)}</div>
                    <div style={{fontSize:11,color:"var(--text2)"}}>{monthTrips.length} viajes</div>
                  </div>
                  <div style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px"}}>
                    <div style={{fontSize:10,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.04em"}}>Pendiente</div>
                    <div style={{fontSize:22,fontWeight:800,color:"#185FA5",marginTop:3}}>L.{fmt(pendingAmt)}</div>
                    <div style={{fontSize:11,color:"var(--text2)"}}>por reembolsar</div>
                  </div>
                </div>
                <button onClick={()=>setTab("viaje")} style={{width:"100%",background:"linear-gradient(135deg,#0F6E56,#1D9E75)",color:"white",border:"none",borderRadius:14,padding:"16px",fontSize:15,fontWeight:800,cursor:"pointer",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  🚗 Iniciar nuevo viaje
                </button>
                <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>Últimos viajes</div>
                {myTrips.length===0&&<div style={{color:"var(--text2)",fontSize:13,textAlign:"center",padding:"16px 0"}}>Sin viajes aún</div>}
                {myTrips.slice(0,3).map(t=>{
                  const cl=clients.find(c=>c.id===t.clientId);
                  return(
                    <div key={t.id} style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div><div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{cl?.name||"—"}</div><div style={{fontSize:11,color:"var(--text2)",marginTop:1}}>{t.date} · {t.km} km{(t.stops||[]).length>0?` · ${t.stops.length} parada${t.stops.length!==1?"s":""}`:""}</div></div>
                      <div style={{textAlign:"right"}}><div style={{fontWeight:700,fontSize:12,color:"#185FA5"}}>L.{fmt(t.reimbursement)}</div><Badge type={t.status}>{t.status}</Badge></div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* ── PLANIFICAR ── */}
            {tab==="viaje"&&!active&&orderMode===null&&(
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
                  <button onClick={()=>setTab("inicio")} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text2)",fontSize:20,padding:0}}>←</button>
                  <div style={{fontWeight:700,fontSize:15,color:"var(--text)"}}>Planificar viaje</div>
                </div>

                {destinations.map((dest,idx)=>{
                  const label=idx===0?"🏁 Destino principal":`📍 Destino ${idx+1}`;
                  return(
                    <div key={idx} style={{background:idx===0?"var(--surface)":"#FFF9F0",borderRadius:12,padding:"12px",marginBottom:10,border:`1px solid ${idx===0?"var(--border)":"#EF9F27"}`}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                        <span style={{fontSize:12,fontWeight:700,color:idx===0?"var(--text)":"#854F0B"}}>{label}</span>
                        {idx>0&&<button onClick={()=>removeDestination(idx)} style={{background:"none",border:"none",cursor:"pointer",color:"#993C1D",fontSize:18,padding:0,lineHeight:1}}>×</button>}
                      </div>
                      {dest.type==="mandado"?(
                        <div>
                          <PlacesSearch apiKey={mapsKey} onSelect={place=>{
                            updateDest(idx,"clientId","mandado_"+idx);
                            updateDest(idx,"mandadoPlace",place);
                            updateDest(idx,"mandadoName",place.name);
                          }} placeholder="Buscar lugar en Google Maps..."/>
                          {dest.mandadoName&&<div style={{fontSize:11,color:"#0F6E56",marginTop:3,padding:"5px 8px",background:"#E1F5EE",borderRadius:6}}>📍 {dest.mandadoName} — {dest.mandadoPlace?.address}</div>}
                        </div>
                      ):(
                        <Select value={dest.clientId} onChange={v=>updateDest(idx,"clientId",v)}>
                          <option value="">Seleccionar cliente...</option>
                          {clients.map(c=><option key={c.id} value={c.id}>{c.name} — {c.city}</option>)}
                        </Select>
                      )}
                      {user.role==="ventas"?(
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginTop:6}}>
                          {["visita","mandado"].map(t=><button key={t} onClick={()=>updateDest(idx,"type",t)} style={{padding:"5px 3px",borderRadius:7,border:"1px solid var(--border)",fontSize:10,cursor:"pointer",fontWeight:dest.type===t?700:400,background:dest.type===t?"#E6F1FB":"transparent",color:dest.type===t?"#185FA5":"var(--text2)",textAlign:"center"}}>{t==="visita"?"🤝 Visita":"📬 Mandado"}</button>)}
                        </div>
                      ):(
                        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,marginTop:6}}>
                          {["mantenimiento","preventivo","instalación","mandado"].map(t=><button key={t} onClick={()=>updateDest(idx,"type",t)} style={{padding:"5px 2px",borderRadius:7,border:"1px solid var(--border)",fontSize:9,cursor:"pointer",fontWeight:dest.type===t?700:400,background:dest.type===t?"#EEEDFE":"transparent",color:dest.type===t?"#3C3489":"var(--text2)",textAlign:"center"}}>{t==="mantenimiento"?"🔧 Mant.":t==="preventivo"?"🔍 Prev.":t==="instalación"?"⚙️ Inst.":"📬 Mandado"}</button>)}
                        </div>
                      )}
                      {/* Equipment selector */}
                      <div style={{marginTop:6,maxHeight:90,overflowY:"auto"}}>
                        {inventory.filter(e=>e.stock>0).map(eq=>(
                          <div key={eq.id} onClick={()=>toggleDestEquip(idx,eq.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 8px",borderRadius:6,cursor:"pointer",marginBottom:3,background:dest.equipIds.includes(eq.id)?"#E6F1FB":"transparent",border:`1px solid ${dest.equipIds.includes(eq.id)?"#185FA5":"var(--border)"}`}}>
                            <div style={{width:14,height:14,borderRadius:3,border:`2px solid ${dest.equipIds.includes(eq.id)?"#185FA5":"var(--border)"}`,background:dest.equipIds.includes(eq.id)?"#185FA5":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{dest.equipIds.includes(eq.id)&&<span style={{color:"white",fontSize:9,fontWeight:700}}>✓</span>}</div>
                            <span style={{fontSize:11,color:"var(--text)"}}>{eq.name} {eq.model}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}

                <button onClick={addDestination} style={{width:"100%",background:"transparent",border:"1px dashed #EF9F27",color:"#854F0B",borderRadius:10,padding:"9px",fontSize:12,fontWeight:600,cursor:"pointer",marginBottom:12}}>
                  + Agregar destino
                </button>

                <button onClick={start} style={{width:"100%",background:"#185FA5",color:"white",border:"none",borderRadius:14,padding:"14px",fontSize:14,fontWeight:800,cursor:"pointer"}}>
                  ▶ Iniciar viaje
                </button>
              </div>
            )}

            {/* ── ORDENAR DESTINOS ── */}
            {orderMode==="ask"&&(
              <div style={{padding:"8px 0"}}>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>¿Cómo ordenar los destinos?</div>
                <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>Tienes {validDests.length} destinos. ¿Cómo quieres organizarlos?</div>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <button onClick={()=>setOrderMode("manual")} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",textAlign:"left",cursor:"pointer"}}>
                    <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>📍 Manual</div>
                    <div style={{fontSize:12,color:"var(--text2)",marginTop:3}}>Yo decido el orden de los destinos</div>
                  </button>
                  <button onClick={()=>setOrderMode("auto_ask")} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",textAlign:"left",cursor:"pointer"}}>
                    <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>🚀 Automático</div>
                    <div style={{fontSize:12,color:"var(--text2)",marginTop:3}}>El sistema calcula el mejor orden</div>
                  </button>
                </div>
              </div>
            )}

            {/* ── AUTO: LEJOS A CERCA O CERCA A LEJOS ── */}
            {orderMode==="auto_ask"&&(
              <div style={{padding:"8px 0"}}>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>¿Cómo quieres terminar?</div>
                <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>Elige el orden que mejor se adapte a tu ruta</div>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <button onClick={()=>sortDestinations("far_near")} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",textAlign:"left",cursor:"pointer"}}>
                    <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>📏 De lejos a cerca</div>
                    <div style={{fontSize:12,color:"var(--text2)",marginTop:3}}>Empieza por el más lejano y termina cerca de la oficina</div>
                  </button>
                  <button onClick={()=>sortDestinations("near_far")} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",textAlign:"left",cursor:"pointer"}}>
                    <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>🏠 De cerca a lejos</div>
                    <div style={{fontSize:12,color:"var(--text2)",marginTop:3}}>Empieza por los más cercanos primero</div>
                  </button>
                </div>
                <button onClick={()=>setOrderMode("ask")} style={{marginTop:12,background:"none",border:"none",cursor:"pointer",color:"var(--text2)",fontSize:13,textDecoration:"underline"}}>← Volver</button>
              </div>
            )}

            {/* ── MANUAL ORDER ── */}
            {orderMode==="manual"&&(
              <div style={{padding:"8px 0"}}>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>Ordenar manualmente</div>
                <div style={{fontSize:13,color:"var(--text2)",marginBottom:12}}>Usa las flechas para cambiar el orden</div>
                {destinations.filter(d=>d.clientId).map((dest,idx,arr)=>{
                  const cl=clients.find(c=>c.id===dest.clientId);
                  return(
                    <div key={idx} style={{background:"var(--surface)",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:16,fontWeight:700,color:"var(--text2)",minWidth:20}}>{idx+1}</span>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{cl?.name||"—"}</div>
                        <div style={{fontSize:11,color:"var(--text2)"}}>{cl?.city}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:2}}>
                        {idx>0&&<button onClick={()=>{const d=[...destinations.filter(x=>x.clientId)];[d[idx-1],d[idx]]=[d[idx],d[idx-1]];setDestinations(d);}} style={{background:"var(--border)",border:"none",borderRadius:4,cursor:"pointer",padding:"2px 6px",fontSize:12}}>↑</button>}
                        {idx<arr.length-1&&<button onClick={()=>{const d=[...destinations.filter(x=>x.clientId)];[d[idx],d[idx+1]]=[d[idx+1],d[idx]];setDestinations(d);}} style={{background:"var(--border)",border:"none",borderRadius:4,cursor:"pointer",padding:"2px 6px",fontSize:12}}>↓</button>}
                      </div>
                    </div>
                  );
                })}
                <button onClick={()=>{setOrderMode("done");}} style={{width:"100%",background:"#185FA5",color:"white",border:"none",borderRadius:12,padding:"12px",fontSize:13,fontWeight:700,cursor:"pointer",marginTop:8}}>
                  ✓ Confirmar este orden
                </button>
                <button onClick={()=>setOrderMode("ask")} style={{marginTop:8,background:"none",border:"none",cursor:"pointer",color:"var(--text2)",fontSize:13,textDecoration:"underline",display:"block",textAlign:"center",width:"100%"}}>← Volver</button>
              </div>
            )}

            {/* ── ORDER DONE → START ── */}
            {orderMode==="done"&&(
              <div style={{padding:"8px 0"}}>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:12}}>✓ Orden confirmado</div>
                {destinations.filter(d=>d.clientId).map((dest,idx)=>{
                  const cl=clients.find(c=>c.id===dest.clientId);
                  return(
                    <div key={idx} style={{background:"var(--surface)",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:26,height:26,borderRadius:"50%",background:"#185FA5",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{idx+1}</div>
                      <div><div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{cl?.name}</div><div style={{fontSize:11,color:"var(--text2)"}}>{cl?.city} · {dest.type}</div></div>
                    </div>
                  );
                })}
                <button onClick={()=>{
                  // Get current position first, then open Maps
                  navigator.geolocation?.getCurrentPosition(
                    pos=>openGoogleMaps(0,pos.coords.latitude,pos.coords.longitude),
                    ()=>openGoogleMaps(0)
                  );
                  setActive(true);setKm(0);setElapsed(0);setGpsPts([]);
                  setCurrentDestIdx(0);setStartTime(new Date());setTab("activo");
                }} style={{width:"100%",background:"#0F6E56",color:"white",border:"none",borderRadius:14,padding:"14px",fontSize:14,fontWeight:800,cursor:"pointer",marginTop:12}}>
                  ▶ ¡Iniciar viaje!
                </button>
              </div>
            )}

            {/* ── VIAJE ACTIVO ── */}
            {tab==="activo"&&active&&(
              <div>
                <div style={{background:gpsError?"#FCEBEB":"#E1F5EE",borderRadius:10,padding:"10px 13px",marginBottom:10,display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:gpsError?"#A32D2D":"#1D9E75",flexShrink:0,boxShadow:gpsError?"none":"0 0 0 3px rgba(29,158,117,.25)"}}/>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:gpsError?"#A32D2D":"#085041"}}>{gpsError?"Error GPS":"GPS activo · pantalla encendida"}</div>
                    <div style={{fontSize:11,color:gpsError?"#A32D2D":"#0F6E56"}}>{gpsError||`${mins}m ${secs}s · ${gpsPts.length} puntos GPS`}</div>
                  </div>
                </div>

                <div style={{textAlign:"center",padding:"8px 0 12px"}}>
                  <div style={{fontSize:50,fontWeight:800,color:"var(--text)",lineHeight:1,fontFamily:"'DM Mono',monospace"}}>{km.toFixed(1)}</div>
                  <div style={{fontSize:12,color:"var(--text2)",marginTop:3}}>km recorridos</div>
                </div>

                {/* Destinos con estado */}
                <div style={{marginBottom:10}}>
                  {validDests.map((dest,idx)=>{
                    const cl=clients.find(c=>c.id===dest.clientId);
                    const timer=destTimers[idx];
                    const done=timer?.departureStr;
                    const inProgress=timer?.arrivalStr&&!done;
                    const isCurrent=!done&&!inProgress&&idx===currentDestIdx;
                    return(
                      <div key={idx} style={{background:done?"#EAF3DE":inProgress?"#FAEEDA":isCurrent?"#E6F1FB":"var(--surface)",borderRadius:10,padding:"10px 12px",marginBottom:6,border:`1px solid ${done?"#639922":inProgress?"#EF9F27":isCurrent?"#185FA5":"var(--border)"}`}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                          <div style={{flex:1}}>
                            <div style={{display:"flex",alignItems:"center",gap:6}}>
                              <div style={{width:22,height:22,borderRadius:"50%",background:done?"#1D9E75":inProgress?"#EF9F27":isCurrent?"#185FA5":"#aaa",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{done?"✓":idx+1}</div>
                              <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{cl?.name}</div>
                            </div>
                            <div style={{fontSize:11,color:"var(--text2)",marginTop:3,marginLeft:28}}>{dest.type} · {cl?.city}</div>
                            {inProgress&&<div style={{fontSize:11,color:"#854F0B",marginTop:3,marginLeft:28}}>⏱ En destino: {Math.floor((timer?.elapsed||0)/60)}m {(timer?.elapsed||0)%60}s</div>}
                            {done&&<div style={{fontSize:11,color:"#3B6D11",marginTop:3,marginLeft:28}}>✓ {timer.arrivalStr}–{timer.departureStr} · {Math.round((timer.departure-timer.arrival)/60000)} min</div>}
                          </div>
                          <div style={{display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end"}}>
                            {isCurrent&&<button onClick={()=>openGoogleMaps(idx)} style={{background:"#185FA5",color:"white",border:"none",borderRadius:7,padding:"5px 8px",fontSize:10,fontWeight:700,cursor:"pointer"}}>🗺️ Navegar</button>}
                            {isCurrent&&<button onClick={()=>arriveAtDest(idx)} style={{background:"#1D9E75",color:"white",border:"none",borderRadius:7,padding:"5px 8px",fontSize:10,fontWeight:700,cursor:"pointer"}}>📍 Llegué</button>}
                            {inProgress&&<button onClick={()=>departFromDest(idx)} style={{background:"#185FA5",color:"white",border:"none",borderRadius:7,padding:"5px 8px",fontSize:10,fontWeight:700,cursor:"pointer"}}>🚗 Salir</button>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div style={{background:"#EEEDFE",borderRadius:10,padding:"10px 14px",marginBottom:10}}>
                  <div style={{fontSize:11,color:"#3C3489",textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:4}}>Reembolso estimado (combustible)</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,fontSize:11}}>
                    <div><div style={{color:"#534AB7"}}>Km recorridos</div><div style={{fontWeight:700,color:"#26215C",fontFamily:"monospace"}}>{km.toFixed(1)} km</div></div>
                    <div><div style={{color:"#534AB7"}}>Litros usados</div><div style={{fontWeight:700,color:"#26215C",fontFamily:"monospace"}}>{((km/(user?.rendimiento||12))).toFixed(1)} L</div></div>
                    <div><div style={{color:"#534AB7"}}>Costo estimado</div><div style={{fontWeight:800,color:"#26215C",fontFamily:"monospace",fontSize:13}}>L.{fmt(reimb)}</div></div>
                  </div>
                </div>

                <button onClick={end} style={{width:"100%",background:"#993C1D",color:"white",border:"none",borderRadius:14,padding:"13px",fontSize:14,fontWeight:800,cursor:"pointer"}}>
                  ■ Finalizar viaje
                </button>
              </div>
            )}

            {/* ── CITAS ── */}
            {tab==="citas"&&<MisCitas user={user}/>}

            {/* ── REPORTES EMPLEADO ── */}
            {tab==="reportes_emp"&&(
              <div>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:12}}>Mis reportes ({myTrips.length>0?reports.filter(r=>r.technicianId===user.id).length:0})</div>
                {reports.filter(r=>r.technicianId===user.id).length===0&&<div style={{color:"var(--text2)",fontSize:13,padding:"20px 0",textAlign:"center"}}>Sin reportes aún</div>}
                {reports.filter(r=>r.technicianId===user.id).map(rep=>{
                  const cl=clients.find(c=>c.id===rep.clientId);
                  return(
                    <div key={rep.id} style={{background:"var(--surface)",borderRadius:10,padding:"11px 13px",marginBottom:8,border:"1px solid var(--border)"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:12,fontWeight:700,color:"#0F6E56",fontFamily:"monospace",marginBottom:2}}>{rep.reportNum}</div>
                          <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{cl?.name||"—"}</div>
                          <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>{rep.fecha} · {rep.horaLlegada}–{rep.horaSalida}</div>
                          {(rep.marca||rep.modelo)&&<div style={{fontSize:11,color:"var(--text2)",marginTop:1}}>🔧 {[rep.marca,rep.modelo].filter(Boolean).join(" ")}</div>}
                        </div>
                        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                          <span style={{fontSize:18}}>{rep.signed?"✅":"⏳"}</span>
                          <button onClick={()=>window.open(`/api/reports/${rep.id}/pdf`,"_blank")} style={{background:"#0F6E56",color:"white",border:"none",borderRadius:6,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>📄 PDF</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* ── HISTORIAL ── */}
            {tab==="historial"&&(
              <div>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:12}}>Mis viajes ({myTrips.length})</div>
                {myTrips.length===0&&<div style={{color:"var(--text2)",fontSize:13,padding:"20px 0",textAlign:"center"}}>Sin viajes aún</div>}
                {myTrips.map(t=>{
                  const cl=clients.find(c=>c.id===t.clientId);
                  return(
                    <div key={t.id} style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px",marginBottom:8}}>
                      <div style={{display:"flex",justifyContent:"space-between"}}>
                        <div>
                          <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{cl?.name||"—"}</div>
                          <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>{t.date} · {t.km} km · {t.tripType}</div>
                          {(t.stops||[]).length>0&&<div style={{fontSize:11,color:"#854F0B",marginTop:1}}>📍 {t.stops.length} destino{t.stops.length!==1?"s":""} en el camino</div>}
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontWeight:800,fontSize:13,color:"#185FA5"}}>L.{fmt(t.reimbursement)}</div>
                          <div style={{marginTop:3}}><Badge type={t.status}>{t.status}</Badge></div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* ── PERFIL ── */}
            {tab==="perfil"&&(
              <div style={{padding:"8px 0"}}>
                <div style={{textAlign:"center",padding:"16px 0 20px"}}>
                  <Avatar initials={initials} color={user.color} size={68}/>
                  <div style={{fontWeight:800,fontSize:17,color:"var(--text)",marginTop:12}}>{user.name}</div>
                  <div style={{fontSize:13,color:"var(--text2)",marginTop:4}}>{user.email}</div>
                  <div style={{fontSize:12,background:"#E6F1FB",color:"#185FA5",display:"inline-block",padding:"3px 12px",borderRadius:20,marginTop:6,fontWeight:600}}>{user.role==="admin"?"Administrador":"Técnico"}</div>
                </div>
                <div style={{background:"var(--surface)",borderRadius:12,padding:14}}>
                  {[["Total viajes",myTrips.length],["Total km",`${myTrips.reduce((s,t)=>s+t.km,0)} km`],["Este mes",`${monthTrips.length} viajes`],["Pendiente",`L.${fmt(pendingAmt)}`],["Reembolsado",`L.${fmt(myTrips.filter(t=>t.status==="reembolsado").reduce((s,t)=>s+t.reimbursement,0))}`]].map(([l,v],i,a)=>(
                    <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:i<a.length-1?"1px solid var(--border)":"none",fontSize:13}}><span style={{color:"var(--text2)"}}>{l}</span><span style={{fontWeight:700,color:"var(--text)"}}>{v}</span></div>
                  ))}
                </div>
              </div>
            )}

          </div>

          {/* Report Modal */}
          {reportModal&&<ReportModal
            destIdx={reportModal.destIdx}
            client={reportModal.client}
            arrivalTime={reportModal.arrivalTime}
            destType={reportModal.destType}
            user={user}
            tripId={reportModal.tripId}
            selectedEquips={reportModal.equipIds||[]}
            inventory={inventory}
            onSave={(data)=>{
              setReportData(prev=>({...prev,[reportModal.destIdx]:data}));
              if(data.reportId){setLastReportId(data.reportId);reportIdRef.current=data.reportId;}
              if(data.reportNum){setLastReportNum(data.reportNum);reportNumRef.current=data.reportNum;}
              confirmDepart(reportModal.destIdx);
            }}
            onClose={()=>setReportModal(null)}
          />}

          {/* Tab bar */}
          <div style={{display:"flex",borderTop:"1px solid var(--border)",padding:"8px 0 6px",background:"var(--card)"}}>
            {[{k:"inicio",i:"🏠",l:"Inicio"},{k:"citas",i:"📅",l:"Citas"},{k:"viaje",i:"🚗",l:"Viaje"},{k:"reportes_emp",i:"📄",l:"Reportes"},{k:"historial",i:"📋",l:"Historial"},{k:"perfil",i:"👤",l:"Perfil"}].map(t=>(
              <button key={t.k} onClick={()=>{
                if(t.k==="viaje"&&active){setTab("activo");return;}
                if(t.k!=="inicio"&&t.k!=="historial"&&t.k!=="perfil") return;
                setTab(t.k);
              }} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 0",color:(tab===t.k||(t.k==="viaje"&&(tab==="activo"||tab==="viaje"||orderMode!==null)))?"#185FA5":"var(--text2)"}}>
                <span style={{fontSize:20}}>{t.i}</span>
                <span style={{fontSize:9,fontWeight:(tab===t.k||(t.k==="viaje"&&(tab==="activo"||tab==="viaje"||orderMode!==null)))?700:400}}>{t.l}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── AJUSTES ──────────────────────────────────────────────────────────────────
function Ajustes({rate,onSaveRate,mapsKey,onSaveMapsKey,companyName,onSaveCompany,dark,setDark,fuelGasPrice:initGas=95,fuelDieselPrice:initDiesel=85,onSaveFuelPrices}){
  const [rateVal,setRateVal]=useState(rate);
  const [keyVal,setKeyVal]=useState(mapsKey||"");
  const [nameVal,setNameVal]=useState(companyName||"");
  const [fuelGasPrice,setFuelGasPrice]=useState(initGas);
  const [fuelDieselPrice,setFuelDieselPrice]=useState(initDiesel);
  useEffect(()=>{setRateVal(rate);},[rate]);
  return(
    <div style={{maxWidth:560,display:"flex",flexDirection:"column",gap:16}}>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>Nombre de la empresa</div>
        <div style={{display:"flex",gap:8}}>
          <input value={nameVal} onChange={e=>setNameVal(e.target.value)} style={{flex:1,padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13}}/>
          <Btn variant="primary" onClick={()=>onSaveCompany(nameVal)}>Guardar</Btn>
        </div>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>Google Maps API Key</div>
        <div style={{fontSize:13,color:"var(--text2)",marginBottom:10,lineHeight:1.6}}>
          Ingresa tu API Key para mostrar mapas reales en los viajes.<br/>
          Obtenla gratis en: <a href="https://console.cloud.google.com" target="_blank" style={{color:"var(--accent)"}}>console.cloud.google.com</a>
          <br/><span style={{fontSize:12,color:"#3B6D11"}}>✓ El nivel gratuito cubre +40,000 cargas de mapa/mes</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          <input value={keyVal} onChange={e=>setKeyVal(e.target.value)} placeholder="AIzaSy..." type="password" style={{flex:1,padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13,fontFamily:"monospace"}}/>
          <Btn variant="primary" onClick={()=>onSaveMapsKey(keyVal)}>Guardar</Btn>
        </div>
        {!mapsKey&&<div style={{marginTop:8,fontSize:12,color:"#854F0B",background:"#FAEEDA",borderRadius:6,padding:"6px 10px"}}>Sin API Key: se muestra mapa SVG básico en los viajes</div>}
        {mapsKey&&<div style={{marginTop:8,fontSize:12,color:"#3B6D11",background:"#EAF3DE",borderRadius:6,padding:"6px 10px"}}>✓ Google Maps activo</div>}
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:12}}>Apariencia</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:13,color:"var(--text2)"}}>Modo oscuro</span>
          <button onClick={()=>setDark(d=>!d)} style={{background:dark?"#185FA5":"var(--surface)",border:"1px solid var(--border)",borderRadius:20,padding:"6px 18px",fontSize:13,cursor:"pointer",color:dark?"white":"var(--text)",fontWeight:600}}>{dark?"● Activado":"○ Desactivado"}</button>
        </div>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>⛽ Precio del combustible</div>
        <div style={{fontSize:13,color:"var(--text2)",marginBottom:10}}>Se usa para calcular el reembolso de gasolina según el rendimiento de cada vehículo</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div><label style={{fontSize:12,color:"var(--text2)",display:"block",marginBottom:4}}>Gasolina (L. por litro)</label><input type="number" value={fuelGasPrice} onChange={e=>setFuelGasPrice(+e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:14,fontWeight:700}}/></div>
          <div><label style={{fontSize:12,color:"var(--text2)",display:"block",marginBottom:4}}>Diesel (L. por litro)</label><input type="number" value={fuelDieselPrice} onChange={e=>setFuelDieselPrice(+e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:14,fontWeight:700}}/></div>
        </div>
        <div style={{marginTop:10,background:"#E6F1FB",borderRadius:8,padding:"10px 12px",fontSize:12,color:"#185FA5"}}>
          Ejemplo: Técnico con rendimiento 12 km/L hace 100 km → consume 8.33 L → reembolso gasolina: <strong>L.{fmt((100/12)*fuelGasPrice)}</strong>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:10}}><Btn variant="primary" onClick={()=>{onSaveFuelPrices(fuelGasPrice,fuelDieselPrice);}}>Guardar precios</Btn></div>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:8}}>Acerca de Servvoo</div>
        <div style={{fontSize:13,color:"var(--text2)",lineHeight:1.8}}>Versión 1.0 · Plataforma de operaciones inteligente<br/>Diseñado para empresas en Centroamérica y el mundo 🌎<br/><br/><span style={{color:"#1D9E75",fontWeight:600}}>✓ Conectado a base de datos en vivo</span></div>
      </div>
      <div style={{background:"#FCEBEB",border:"1px solid #E74C3C",borderRadius:12,padding:16}}>
        <div style={{fontWeight:700,fontSize:14,color:"#C0392B",marginBottom:4}}>⚠️ Zona de pruebas</div>
        <div style={{fontSize:12,color:"#7B241C",marginBottom:10}}>Solo usar para limpiar datos de prueba</div>
        <button onClick={async()=>{
          if(!confirm("¿Borrar TODOS los clientes? Esta acción no se puede deshacer.")) return;
          await fetch("/api/clients/deleteall",{method:"POST"});

// ─── FINANCIADO FORM ─────────────────────────────────────────────────────────
function FinanciadoForm({eq,onSave}){
  const [precio,setPrecio]=useState(eq.contrato_valor||"");
  const [prima,setPrima]=useState(eq.prima||"");
  const [plazo,setPlazo]=useState(eq.contrato_meses||6);
  const [interes,setInteres]=useState(eq.interes||15);
  const [inicio,setInicio]=useState(eq.contrato_inicio||new Date().toISOString().slice(0,10));
  const [saving,setSaving]=useState(false);

  const fmt=n=>(+n||0).toLocaleString("es-HN",{minimumFractionDigits:2,maximumFractionDigits:2});
  const fmt0=n=>(+n||0).toLocaleString("es-HN",{minimumFractionDigits:0});

  // Calculations
  const primaMin=precio?(+precio*0.5):0;
  const primaVal=prima?+prima:primaMin;
  const montoFinanciar=Math.max(0,(+precio||0)-primaVal);
  const totalInteres=montoFinanciar*(+interes/100);
  const totalPagar=montoFinanciar+totalInteres;
  const cuotaMensual=plazo>0?totalPagar/+plazo:0;

  // Progress calculation
  const now=new Date();
  const inicioDate=inicio?new Date(inicio):null;
  const mesesPagados=inicioDate?Math.max(0,Math.floor((now-inicioDate)/(30.44*24*3600*1000))):0;
  const pagado=Math.min(mesesPagados*cuotaMensual,totalPagar);
  const saldo=Math.max(0,totalPagar-pagado);
  const pct=totalPagar>0?Math.min(Math.round((pagado/totalPagar)*100),100):0;
  const mesesRestantes=Math.max(0,+plazo-mesesPagados);

  const handleSave=async()=>{
    setSaving(true);
    await onSave({
      contratoValor:+precio,
      prima:primaVal,
      contratoMeses:+plazo,
      contratoInicio:inicio,
      interes:+interes,
      cuotaMensual:+cuotaMensual.toFixed(2)
    });
    setSaving(false);
  };

  return(
    <div style={{background:"#FFF9F0",borderRadius:10,padding:12,marginBottom:8,border:"1px solid #F5C97C"}}>
      <div style={{fontWeight:700,fontSize:12,color:"#854F0B",marginBottom:10}}>💰 Contrato de financiamiento</div>

      {/* Input fields */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
        <div>
          <div style={{fontSize:10,color:"#854F0B",marginBottom:3}}>Precio del equipo (L.)</div>
          <input type="number" value={precio} onChange={e=>setPrecio(e.target.value)} placeholder="Ej: 150000"
            style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #F5C97C",background:"white",fontSize:12}}/>
        </div>
        <div>
          <div style={{fontSize:10,color:"#854F0B",marginBottom:3}}>Prima (mín. 50%) L.</div>
          <input type="number" value={prima} onChange={e=>setPrima(e.target.value)} placeholder={`Mín: L.${fmt0(primaMin)}`}
            style={{width:"100%",padding:"6px 8px",borderRadius:6,border:`1px solid ${prima&&+prima<primaMin?"#E74C3C":"#F5C97C"}`,background:"white",fontSize:12}}/>
          {prima&&+prima<primaMin&&<div style={{fontSize:9,color:"#E74C3C",marginTop:2}}>⚠️ Prima mínima: L.{fmt0(primaMin)}</div>}
        </div>
        <div>
          <div style={{fontSize:10,color:"#854F0B",marginBottom:3}}>Plazo</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:3}}>
            {[3,6,9,12].map(p=>(
              <button key={p} onClick={()=>setPlazo(p)} style={{padding:"5px 2px",borderRadius:5,border:"1px solid",borderColor:plazo===p?"#EF9F27":"#F5C97C",background:plazo===p?"#EF9F27":"white",color:plazo===p?"white":"#854F0B",fontSize:11,fontWeight:plazo===p?700:400,cursor:"pointer"}}>{p}m</button>
            ))}
          </div>
        </div>
        <div>
          <div style={{fontSize:10,color:"#854F0B",marginBottom:3}}>Interés sobre financiado (%)</div>
          <input type="number" value={interes} onChange={e=>setInteres(e.target.value)} max="15" min="0" step="0.5"
            style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #F5C97C",background:"white",fontSize:12}}/>
        </div>
        <div style={{gridColumn:"1/-1"}}>
          <div style={{fontSize:10,color:"#854F0B",marginBottom:3}}>Fecha inicio contrato</div>
          <input type="date" value={inicio} onChange={e=>setInicio(e.target.value)}
            style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #F5C97C",background:"white",fontSize:12}}/>
        </div>
      </div>

      {/* Summary */}
      {precio&&(
        <div style={{background:"white",borderRadius:8,padding:"10px 12px",marginBottom:8,border:"1px solid #F5C97C"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#854F0B",marginBottom:6}}>📊 Resumen del contrato</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,fontSize:11,color:"#5C3209"}}>
            <div>💵 Precio: <strong>L.{fmt0(precio)}</strong></div>
            <div>🤝 Prima: <strong>L.{fmt0(primaVal)}</strong></div>
            <div>💳 A financiar: <strong>L.{fmt0(montoFinanciar)}</strong></div>
            <div>📈 Interés ({interes}%): <strong>L.{fmt0(totalInteres)}</strong></div>
            <div>🧾 Total a pagar: <strong>L.{fmt0(totalPagar)}</strong></div>
            <div style={{color:"#EF9F27",fontWeight:700}}>📅 Cuota/mes: <strong>L.{fmt(cuotaMensual)}</strong></div>
          </div>
        </div>
      )}

      {/* Progress if contract started */}
      {inicio&&precio&&mesesPagados>0&&(
        <div style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#854F0B",marginBottom:3}}>
            <span>Progreso del contrato</span>
            <span>{pct}% — {mesesPagados} de {plazo} meses</span>
          </div>
          <div style={{background:"#F5E6C8",borderRadius:4,height:10,overflow:"hidden",marginBottom:4}}>

function DiprodInventario({mapsKey}){
  const [tab,setTab]=useState("equipos");
  const [excelMapper,setExcelMapper]=useState(null);
  const [showAddEquipo,setShowAddEquipo]=useState(false);
  const [toastMsg,setToastMsg]=useState("");
  const showToastLocal=msg=>{setToastMsg(msg);setTimeout(()=>setToastMsg(""),3000);};
  const [equipos,setEquipos]=useState([]);
  const [repuestos,setRepuestos]=useState([]);
  const [accesorios,setAccesorios]=useState([]);
  const [stats,setStats]=useState({});
  const [loading,setLoading]=useState(true);
  const [imported,setImported]=useState(false);
  const [filterTipo,setFilterTipo]=useState("");
  const [filterEstado,setFilterEstado]=useState("");
  const [filterCliente,setFilterCliente]=useState("");
  const [search,setSearch]=useState("");
  const [selected,setSelected]=useState(null);
  const [editModal,setEditModal]=useState(null);

  const loadData=async()=>{
    setLoading(true);
    try{
      const [eq,rep,acc,st]=await Promise.all([
        fetch("/api/diprodi/equipos").then(r=>r.json()),
        fetch("/api/diprodi/repuestos").then(r=>r.json()),
        fetch("/api/diprodi/accesorios").then(r=>r.json()),
        fetch("/api/diprodi/stats").then(r=>r.json()),
      ]);
      setEquipos(eq);setRepuestos(rep);setAccesorios(acc);setStats(st);
    }catch(e){}
    setLoading(false);
  };

  const handleExcelUpload=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    setLoading(true);
    try{
      // Use SheetJS to parse Excel
      const XLSX=window.XLSX||await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js");
      const data=await file.arrayBuffer();
      const wb=XLSX.read(data,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});

      // Convert Excel serial date to string
      const excelDate=v=>{
        if(!v) return "";
        if(typeof v==="number"&&v>40000){
          // Excel serial date — convert
          const d=new Date((v-25569)*86400*1000);
          return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
        }
        return String(v).trim();
      };

      // Exact column names from DIPRODI Excel
      const equiposData=rows.map((r,i)=>{
        const num=r["#"]||i+1;
        const loc=r["Localizacion"]||r["Localización"]||r["localizacion"]||"";
        const cli=r["Veterinaria"]||r["Cliente"]||r["veterinaria"]||"";
        const tipo=r["Equipo"]||r["equipo"]||r["Tipo"]||"";
        const modelo=r["Modelo de Equipo"]||r["Modelo"]||r["modelo"]||"";
        const serie=r["# de serie"]||r["Serie"]||r["serie"]||r["Numero de Serie"]||"";
        const ingreso=excelDate(r["Fecha de ingreso"]||r["Fecha Ingreso"]||"");
        const instalacion=excelDate(r["Fecha de instalación"]||r["Fecha de instalacion"]||r["Fecha Instalacion"]||"");
        const sw=r["Version de software"]||r["Version"]||r["version"]||"";
        const com=r["Comentarios"]||r["comentarios"]||"";
        return {num:+num||i+1,localizacion:String(loc).trim(),cliente:String(cli).trim(),
          tipo:String(tipo).trim(),modelo:String(modelo).trim(),serie:String(serie).trim(),
          fechaIngreso:ingreso,fechaInstalacion:instalacion,versionSw:String(sw).trim(),comentarios:String(com).trim()};
      }).filter(r=>r.cliente&&r.cliente.toLowerCase()!=="veterinaria"&&r.cliente.toLowerCase()!=="cliente"&&r.cliente!=="undefined");

      if(equiposData.length===0){
        const cols=Object.keys(rows[0]||{}).join("\n");
        alert(`No se encontraron datos válidos.\n\nColumnas detectadas en tu Excel:\n${cols}\n\nVerifica que la primera fila tenga los encabezados correctos.`);
        setLoading(false);
        return;
      }
      
      console.log("Equipos detectados:", equiposData.length, "Ejemplo:", equiposData[0]);

      if(equiposData.length===0){
        alert("No se encontraron datos válidos. Verifica que el Excel tenga las columnas correctas.");
        setLoading(false);
        return;
      }

      // Auto-create clients from Excel that don't exist yet
      const clientesExistentes=await fetch("/api/clients").then(r=>r.json());
      const nombresExistentes=new Set(clientesExistentes.map(c=>c.name.toLowerCase().trim()));
      const veterinariasNuevas=[...new Set(equiposData.map(e=>e.cliente).filter(Boolean))]
        .filter(v=>v.toLowerCase()!=="globalvet"&&v.toLowerCase()!=="bodega"&&!nombresExistentes.has(v.toLowerCase().trim()));
      
      let clientesCreados=0;
      for(const vet of veterinariasNuevas){
        try{
          // Get city from equipment data
          const eqForVet=equiposData.find(e=>e.cliente===vet);
          await fetch("/api/clients",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name:vet,contact:"",phone:"",email:"",city:eqForVet?.localizacion||"",department:"",type:"Veterinaria"})});
          clientesCreados++;
        }catch(e){}
      }

      const res=await fetch("/api/diprodi/bulk",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({equipos:equiposData,repuestos:[],accesorios:[]})
      });
      const result=await res.json();
      await loadData();
      alert(`✅ Importados ${result.imported.equipos} equipos del Excel\n🏥 ${clientesCreados} clientes nuevos creados automáticamente`);
    }catch(err){
      console.error(err);
      alert("Error al procesar el Excel: "+err.message);
    }
    setLoading(false);
    e.target.value="";
  };

  useEffect(()=>{loadData();},[]);

  const importAll=async()=>{
    setLoading(true);
    try{
      // Auto-create clients from embedded data
      const clientesExist=await fetch("/api/clients").then(r=>r.json());
      const nombresExist=new Set(clientesExist.map(c=>c.name.toLowerCase().trim()));
      const vetsNuevas=[...new Set(DIPRODI_EQUIPOS.map(e=>e.cliente).filter(Boolean))]
        .filter(v=>v.toLowerCase()!=="globalvet"&&v.toLowerCase()!=="bodega"&&!nombresExist.has(v.toLowerCase().trim()));

            body:JSON.stringify({name:vet,contact:"",phone:"",email:"",city:eqForVet?.localizacion||"",department:"",type:"Veterinaria"})});
          creados++;
        }catch(e){}
      }

      const res=await fetch("/api/diprodi/bulk",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({equipos:DIPRODI_EQUIPOS,repuestos:DIPRODI_REPUESTOS,accesorios:DIPRODI_ACCESORIOS})
      });

    }catch(e){alert("Error al importar: "+e.message);}
    setLoading(false);
  };

  const estadoColor={
    "instalado":"#1D9E75","bodega":"#185FA5","financiado":"#EF9F27",
    "contado":"#3C3489","demostracion":"#7B6CF6","reparacion":"#993C1D","desconocido":"#999"

    "instalado":"#E1F5EE","bodega":"#E6F1FB","financiado":"#FFF3E0",
    "contado":"#EEEDFE","demostracion":"#F0EFFE","reparacion":"#FCEBEB","desconocido":"#f5f5f5"
  };

  const tipos=[...new Set(equipos.map(e=>e.tipo))].filter(Boolean).sort();
  const estados=[...new Set(equipos.map(e=>e.estado))].filter(Boolean);

// ─── SALES ADMIN PAGE ────────────────────────────────────────────────────────
function SalesAdmin({techs}){
  const now=new Date();
  const mes=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const mesNombre=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][now.getMonth()];
  const [goals,setGoals]=useState({});
  const [totals,setTotals]=useState({});
  const [editGoal,setEditGoal]=useState({});
  const [saving,setSaving]=useState(null);

  const vendedores=techs.filter(t=>t.role==="ventas"||t.role==="admin");

  const load=async()=>{
    try{
      const d=await fetch(`/api/sales/goals?mes=${mes}`).then(r=>r.json());
      setGoals(d.goals||{});setTotals(d.totals||{});
      const eg={};
      vendedores.forEach(v=>{eg[v.id]=d.goals[v.id]?d.goals[v.id].meta:0;});
      setEditGoal(eg);
    }catch(e){}
  };

  useEffect(()=>{load();},[techs.length]);

  const saveMeta=async(uid)=>{
    setSaving(uid);
    try{
      await fetch("/api/sales/goals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:uid,mes,meta:+editGoal[uid]||0})});
      await load();
    }catch(e){}
    setSaving(null);
  };

  const fmt=n=>(+n||0).toLocaleString("es-HN",{minimumFractionDigits:0});

  return(
    <div style={{padding:"0 0 40px"}}>
      <div style={{fontWeight:800,fontSize:20,color:"var(--text)",marginBottom:4}}>🎯 Metas de ventas</div>
      <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>{mesNombre} {now.getFullYear()}</div>

      {vendedores.length===0&&<div style={{color:"var(--text2)",fontSize:14,textAlign:"center",padding:"30px 0"}}>No hay vendedores registrados</div>}

      {vendedores.map(v=>{
        const meta=goals[v.id]?parseFloat(goals[v.id].meta):0;
        const total=parseFloat(totals[v.id]||0);
        const pct=meta>0?Math.min(Math.round((total/meta)*100),100):0;
        return(
          <div key={v.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:16,marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
              <Avatar initials={v.name.split(" ").map(w=>w[0]).join("").slice(0,2)} color={v.color||"blue"} size={36}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{v.name}</div>
                <div style={{fontSize:12,color:"var(--text2)"}}>L.{fmt(total)} vendidos</div>
              </div>
              <div style={{fontSize:20,fontWeight:800,color:pct>=100?"#1D9E75":"var(--text)",fontFamily:"monospace"}}>{pct}%</div>
            </div>

            {/* Progress bar */}
            <div style={{background:"var(--border)",borderRadius:6,height:12,overflow:"hidden",marginBottom:8,position:"relative"}}>
              <div style={{width:`${pct}%`,height:"100%",background:pct>=100?"#1D9E75":"linear-gradient(90deg,#185FA5,#3C3489)",borderRadius:6,transition:"width 0.6s"}}/>
              {pct>15&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",paddingLeft:8,fontSize:10,fontWeight:700,color:"white"}}>{pct}%</div>}
            </div>

            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <div style={{fontSize:11,color:"var(--text2)",whiteSpace:"nowrap"}}>Meta L.</div>
              <input type="number" value={editGoal[v.id]||""} onChange={e=>setEditGoal(p=>({...p,[v.id]:e.target.value}))}
                placeholder="0" style={{flex:1,padding:"6px 10px",borderRadius:7,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13,fontFamily:"monospace"}}/>
              <button onClick={()=>saveMeta(v.id)} disabled={saving===v.id} style={{background:"#185FA5",color:"white",border:"none",borderRadius:7,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                {saving===v.id?"...":"Guardar"}
              </button>
            </div>

            {meta>0&&<div style={{fontSize:11,color:"var(--text2)",marginTop:4}}>
              {pct>=100?`🎉 Meta alcanzada — exceso L.${fmt(total-meta)}`:`Falta L.${fmt(meta-total)} · Meta: L.${fmt(meta)}`}
            </div>}
          </div>
        );
      })}
    </div>
  );
}





// ─── AI ASSISTANT ────────────────────────────────────────────────────────────
function AIAssistant({user,companyId="diprodi"}){
  const [messages,setMessages]=useState([
    {role:"assistant",text:"👋 ¡Hola! Soy tu asistente de negocios con IA. Puedo ayudarte con:\n• Análisis de tu negocio\n• Sugerencias para aumentar ventas\n• Recordatorios de días festivos\n• Ideas de promociones\n\n¿En qué te puedo ayudar hoy?"}
  ]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages]);

  const send=async()=>{
    if(!input.trim()||loading) return;
    const msg=input.trim();
    setInput("");
    setMessages(p=>[...p,{role:"user",text:msg}]);
    setLoading(true);
    try{
      const res=await fetch("/api/ai/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:msg,companyId})});
      const data=await res.json();
      setMessages(p=>[...p,{role:"assistant",text:data.response||data.error||"Error al procesar"}]);
    }catch(e){
      setMessages(p=>[...p,{role:"assistant",text:"Error de conexión. Intenta de nuevo."}]);
    }
    setLoading(false);
  };

  const suggestions=["¿Qué días festivos vienen pronto?","¿Cómo puedo aumentar mis ventas?","Analiza mi negocio","¿Qué promoción me recomiendas?"];

  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)",minHeight:400}}>
      <div style={{fontWeight:800,fontSize:18,color:"var(--text)",marginBottom:12}}>🤖 Asistente IA</div>
      
      {/* Messages */}
      <div style={{flex:1,overflowY:"auto",background:"var(--surface)",borderRadius:12,padding:12,marginBottom:10}}>
        {messages.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:10}}>
            <div style={{
              maxWidth:"80%",padding:"10px 14px",borderRadius:12,fontSize:13,lineHeight:1.6,
              background:m.role==="user"?"#185FA5":"var(--card)",
              color:m.role==="user"?"white":"var(--text)",
              borderBottomRightRadius:m.role==="user"?2:12,
              borderBottomLeftRadius:m.role==="assistant"?2:12,
              whiteSpace:"pre-wrap"
            }}>{m.text}</div>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex",gap:4,padding:"10px 14px"}}>
            {[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:"#185FA5",animation:`bounce 1s infinite ${i*0.2}s`}}/>)}
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Suggestions */}
      {messages.length<=1&&(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
          {suggestions.map(s=>(
            <button key={s} onClick={()=>setInput(s)} style={{fontSize:11,background:"var(--surface)",color:"#185FA5",border:"1px solid #185FA5",borderRadius:20,padding:"4px 10px",cursor:"pointer"}}>{s}</button>
          ))}
        </div>
      )}

      {/* Input */}
      <div style={{display:"flex",gap:8}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder="Escribe tu pregunta..."
          style={{flex:1,padding:"10px 14px",borderRadius:10,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13}}/>
        <button onClick={send} disabled={loading||!input.trim()} style={{background:"#185FA5",color:"white",border:"none",borderRadius:10,padding:"10px 16px",fontSize:14,cursor:"pointer",fontWeight:700,opacity:loading||!input.trim()?0.5:1}}>➤</button>
      </div>
    </div>
  );
}

// ─── CALENDAR COMPONENT ───────────────────────────────────────────────────────
function CalendarioAdmin({companyId="diprodi"}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [events,setEvents]=useState([]);
  const [showAdd,setShowAdd]=useState(null); // date string
  const [newEvent,setNewEvent]=useState({title:"",time:"",color:"#185FA5",allDay:false,notes:"",blocksBooking:false});
  const [loading,setLoading]=useState(false);

  const monthStr=`${year}-${String(month+1).padStart(2,"0")}`;
  const monthNames=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const dayNames=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

  useEffect(()=>{
    setLoading(true);
    fetch(`/api/calendar/events?companyId=${companyId}&month=${monthStr}`)
      .then(r=>r.json()).then(d=>{setEvents(d);setLoading(false);}).catch(()=>setLoading(false));
  },[monthStr]);

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=now.toISOString().slice(0,10);

  const getEventsForDay=(d)=>{
    const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    return events.filter(e=>e.date===dateStr);
  };

  const addEvent=async()=>{
    if(!newEvent.title||!showAdd) return;
    await fetch("/api/calendar/events",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({...newEvent,date:showAdd,companyId})});
    const updated=await fetch(`/api/calendar/events?companyId=${companyId}&month=${monthStr}`).then(r=>r.json());
    setEvents(updated);
    setShowAdd(null);
    setNewEvent({title:"",time:"",color:"#185FA5",allDay:false,notes:"",blocksBooking:false});
  };

  const deleteEvent=async(id)=>{
    await fetch(`/api/calendar/events/${id}`,{method:"DELETE"});
    setEvents(p=>p.filter(e=>e.id!==id));
  };

  return(
    <div style={{padding:"0 0 40px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:800,fontSize:20,color:"var(--text)"}}>📅 Calendario</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button onClick={()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:7,padding:"5px 10px",cursor:"pointer",color:"var(--text)"}}>◀</button>
          <span style={{fontWeight:700,fontSize:14,color:"var(--text)",minWidth:120,textAlign:"center"}}>{monthNames[month]} {year}</span>
          <button onClick={()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:7,padding:"5px 10px",cursor:"pointer",color:"var(--text)"}}>▶</button>
        </div>
      </div>

      {/* Day headers */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        {dayNames.map(d=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--text2)",padding:"4px 0"}}>{d}</div>)}
      </div>

      {/* Calendar grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {Array(firstDay).fill(null).map((_,i)=><div key={`e${i}`}/>)}
        {Array(daysInMonth).fill(null).map((_,i)=>{
          const d=i+1;
          const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const dayEvents=getEventsForDay(d);
          const isToday=dateStr===today;
          return(
            <div key={d} onClick={()=>setShowAdd(dateStr)}
              style={{minHeight:70,background:isToday?"#E6F1FB":"var(--surface)",borderRadius:8,padding:"4px 6px",cursor:"pointer",border:`1px solid ${isToday?"#185FA5":"var(--border)"}`,transition:"all 0.1s"}}
              onMouseEnter={e=>e.currentTarget.style.background=isToday?"#d0e8f8":"var(--card)"}
              onMouseLeave={e=>e.currentTarget.style.background=isToday?"#E6F1FB":"var(--surface)"}>
              <div style={{fontSize:12,fontWeight:isToday?800:400,color:isToday?"#185FA5":"var(--text)",marginBottom:3}}>{d}</div>
              {dayEvents.slice(0,3).map(ev=>(
                <div key={ev.id} onClick={e=>{e.stopPropagation();if(confirm(`¿Eliminar "${ev.title}"?`))deleteEvent(ev.id);}}
                  style={{fontSize:9,background:ev.color||"#185FA5",color:"white",borderRadius:3,padding:"2px 4px",marginBottom:2,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                  {ev.time&&`${ev.time} `}{ev.title}
                </div>
              ))}
              {dayEvents.length>3&&<div style={{fontSize:9,color:"var(--text2)"}}>+{dayEvents.length-3} más</div>}
            </div>
          );
        })}
      </div>

      {/* Add event modal */}
      {showAdd&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>

  );
}

// ─── FINANCIAL SUMMARY ────────────────────────────────────────────────────────

  useEffect(()=>{
    setLoading(true);

  const fmt=n=>`L.${(+n||0).toLocaleString("es-HN",{minimumFractionDigits:2})}`;

              <div style={{fontSize:11,color:"#0F6E56",textTransform:"uppercase",fontWeight:700}}>Ingresos del mes</div>
