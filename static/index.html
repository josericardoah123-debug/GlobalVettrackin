// ─── FACTURACIÓN ─────────────────────────────────────────────────────────────
function Facturacion({clients,techs,repuestos=[],inventory=[]}){
  const [invoices,setInvoices]=useState([]);
  const [showNew,setShowNew]=useState(false);
  const [loading,setLoading]=useState(true);
  const [form,setForm]=useState({
    clientId:"",clientName:"",clientRtn:"",clientAddress:"",
    items:[{description:"",qty:1,price:0,inventoryId:""}],
    isvRate:15,paymentMethod:"efectivo",cai:"",notes:""
  });

  useEffect(()=>{
    fetch("/api/invoices").then(r=>r.json()).then(d=>{setInvoices(d);setLoading(false);}).catch(()=>setLoading(false));
  },[]);

  const fmt=n=>`L.${(+n||0).toLocaleString("es-HN",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const subtotal=form.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0);
  const isv=subtotal*(+form.isvRate/100);
  const total=subtotal+isv;

  const addItem=()=>setForm(p=>({...p,items:[...p.items,{description:"",qty:1,price:0,inventoryId:""}]}));
  const removeItem=idx=>setForm(p=>({...p,items:p.items.filter((_,i)=>i!==idx)}));
  const updateItem=(idx,k,v)=>setForm(p=>({...p,items:p.items.map((it,i)=>i===idx?{...it,[k]:v}:it)}));

  const selectClient=(id)=>{
    const cl=clients.find(c=>c.id===id);
    setForm(p=>({...p,clientId:id,clientName:cl?.name||"",clientRtn:cl?.rtn||"",clientAddress:`${cl?.address||""} ${cl?.city||""}`.trim()}));
  };

  const selectInventoryItem=(idx,itemId)=>{
    const item=[...repuestos,...inventory].find(r=>r.id===itemId);
    if(item) updateItem(idx,"description",`${item.nombre||item.name} ${item.num_parte||item.model||""}`.trim());
    updateItem(idx,"inventoryId",itemId);
  };

  const saveInvoice=async()=>{
    if(!form.clientName&&!form.clientId){alert("Selecciona o escribe el nombre del cliente.");return;}
    if(form.items.every(i=>!i.description)){alert("Agrega al menos un item a la factura.");return;}
    const res=await fetch("/api/invoices",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(form)});
    const data=await res.json();
    if(data.invoiceNum){
      const updated=await fetch("/api/invoices").then(r=>r.json());
      setInvoices(updated);
      setShowNew(false);
      setForm({clientId:"",clientName:"",clientRtn:"",clientAddress:"",items:[{description:"",qty:1,price:0,inventoryId:""}],isvRate:15,paymentMethod:"efectivo",cai:"",notes:""});
      alert(`✅ Factura ${data.invoiceNum} creada · Total: ${fmt(data.total)}`);
    }
  };

  const totalPendiente=invoices.filter(i=>i.status==="pendiente").reduce((s,i)=>s+(+i.total||0),0);
  const totalPagado=invoices.filter(i=>i.status==="pagada").reduce((s,i)=>s+(+i.total||0),0);

  return(
    <div style={{padding:"0 0 40px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{fontWeight:800,fontSize:20,color:"var(--text)"}}>🧾 Facturación</div>
          <div style={{fontSize:12,color:"var(--text2)",marginTop:2}}>{invoices.length} facturas</div>
        </div>
        <button onClick={()=>setShowNew(true)} style={{background:"#0F6E56",color:"white",border:"none",borderRadius:10,padding:"10px 16px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Nueva factura</button>
      </div>

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
        {[["Pendiente",fmt(totalPendiente),"#EF9F27","#FFF3E0"],
          ["Cobrado",fmt(totalPagado),"#1D9E75","#E1F5EE"],
          ["Total",fmt(totalPendiente+totalPagado),"#185FA5","#E6F1FB"]
        ].map(([l,v,c,bg])=>(
          <div key={l} style={{background:bg,borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:10,color:c,textTransform:"uppercase",fontWeight:600}}>{l}</div>
            <div style={{fontSize:14,fontWeight:800,color:c,marginTop:2,fontFamily:"monospace"}}>{v}</div>
          </div>
        ))}
      </div>

      {/* Invoice list */}
      {loading&&<div style={{textAlign:"center",padding:30,color:"var(--text2)"}}>Cargando...</div>}
      {!loading&&invoices.length===0&&<div style={{textAlign:"center",padding:"30px 0",color:"var(--text2)"}}>Sin facturas aún</div>}
      {invoices.map(inv=>(
        <div key={inv.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
              <span style={{fontSize:12,fontWeight:700,color:"#0F6E56",fontFamily:"monospace"}}>{inv.invoice_num}</span>
              <span style={{fontSize:10,background:inv.status==="pagada"?"#E1F5EE":"#FFF3E0",color:inv.status==="pagada"?"#0F6E56":"#EF9F27",padding:"2px 7px",borderRadius:4,fontWeight:600}}>{inv.status}</span>
            </div>
            <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{inv.client_name||"—"}</div>
            <div style={{fontSize:11,color:"var(--text2)",marginTop:1}}>{inv.created_at?.slice(0,10)} · {inv.items?.length||0} items · {inv.payment_method}</div>
          </div>
          <div style={{textAlign:"right",display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end"}}>
            <div style={{fontSize:15,fontWeight:800,color:"var(--text)",fontFamily:"monospace"}}>L.{(+inv.total||0).toLocaleString("es-HN",{minimumFractionDigits:2})}</div>
            <div style={{display:"flex",gap:4}}>
              {inv.status==="pendiente"&&<button onClick={async()=>{await fetch(`/api/invoices/${inv.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"pagada"})});const u=await fetch("/api/invoices").then(r=>r.json());setInvoices(u);}} style={{fontSize:10,background:"#E1F5EE",color:"#0F6E56",border:"none",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontWeight:600}}>✓ Marcar pagada</button>}

// ─── AGENDA ADMIN PAGE ───────────────────────────────────────────────────────
function AgendaAdmin({techs}){
  const [bookings,setBookings]=useState([]);
  const [loading,setLoading]=useState(true);
  const [assignModal,setAssignModal]=useState(null);
  const bookingUrl=window.location.origin+"/agendar";

  useEffect(()=>{
    fetch("/api/booking").then(r=>r.json()).then(b=>{setBookings(b);setLoading(false);}).catch(()=>setLoading(false));
  },[]);

  const updateBooking=async(id,data)=>{
    const res=await fetch(`/api/booking/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
    const updated=await res.json();
    setBookings(p=>p.map(b=>b.id===id?{...b,...data,...updated}:b));
  };

  const assignTech=async(bookingId,techId)=>{
    // Generate video link if videollamada
    const booking=bookings.find(b=>b.id===bookingId);
    const videoLink=booking?.modalidad==="videollamada"?`https://meet.jit.si/DIPRODI-${bookingId.slice(-6)}`:"";
    await updateBooking(bookingId,{technicianId:techId,status:"confirmado",videoLink});
    setAssignModal(null);
  };

  const statusColor={pendiente:"#EF9F27",confirmado:"#1D9E75",completado:"#185FA5",cancelado:"#E74C3C"};
  const statusBg={pendiente:"#FFF3E0",confirmado:"#E1F5EE",completado:"#E6F1FB",cancelado:"#FCEBEB"};
  const pending=bookings.filter(b=>b.status==="pendiente");
  const confirmed=bookings.filter(b=>b.status==="confirmado");

  return(
    <div style={{padding:"0 0 40px"}}>
      <div style={{fontWeight:800,fontSize:20,color:"var(--text)",marginBottom:4}}>📅 Agenda de servicios</div>

      {/* Booking link */}
      <div style={{background:"linear-gradient(135deg,#0C447C,#1D9E75)",borderRadius:12,padding:16,marginBottom:16,color:"white"}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>🔗 Link para que los clientes agenden</div>
        <div style={{background:"rgba(255,255,255,0.15)",borderRadius:8,padding:"8px 12px",fontSize:12,fontFamily:"monospace",marginBottom:8,wordBreak:"break-all"}}>{bookingUrl}</div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>{navigator.clipboard.writeText(bookingUrl);alert("Link copiado ✓");}} style={{background:"rgba(255,255,255,0.2)",color:"white",border:"none",borderRadius:7,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>📋 Copiar link</button>
          <button onClick={()=>window.open(bookingUrl,"_blank")} style={{background:"rgba(255,255,255,0.2)",color:"white",border:"none",borderRadius:7,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>🌐 Abrir página</button>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
        {[["Pendientes",pending.length,"#EF9F27","#FFF3E0"],["Confirmados",confirmed.length,"#1D9E75","#E1F5EE"],
          ["Completados",bookings.filter(b=>b.status==="completado").length,"#185FA5","#E6F1FB"],
          ["Total",bookings.length,"var(--text)","var(--surface)"]
        ].map(([l,v,c,bg])=>(
          <div key={l} style={{background:bg,borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:10,color:c,textTransform:"uppercase",fontWeight:600}}>{l}</div>
            <div style={{fontSize:22,fontWeight:800,color:c,marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>

      {loading&&<div style={{textAlign:"center",padding:30,color:"var(--text2)"}}>Cargando...</div>}

      {/* Bookings list */}
      {[["⏳ Pendientes de confirmar",pending],["✅ Confirmados",confirmed],
        ["📋 Historial",[...bookings.filter(b=>b.status==="completado"),...bookings.filter(b=>b.status==="cancelado")]]
      ].map(([title,list])=>list.length>0&&(
        <div key={title} style={{marginBottom:20}}>
          <div style={{fontWeight:700,fontSize:14,color:"var(--text)",marginBottom:8}}>{title}</div>
          {list.map(b=>(
            <div key={b.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px",marginBottom:6}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{b.client_name}</div>
                  <div style={{fontSize:12,color:"var(--text2)",marginTop:2}}>📞 {b.client_phone} {b.client_email?`· ✉️ ${b.client_email}`:""}</div>
                  <div style={{fontSize:12,color:"#185FA5",marginTop:2,fontWeight:600}}>📅 {b.date} a las {b.time}</div>
                  <div style={{fontSize:12,color:"var(--text2)",marginTop:2}}>{b.tipo_servicio==="mantenimiento"?"🔧 Mantenimiento preventivo":b.tipo_servicio==="reparacion"?"🛠️ Reparación/Emergencia":b.tipo_servicio==="instalacion"?"⚙️ Instalación":b.tipo_servicio==="capacitacion"?"📚 Capacitación":"📋 Otro"}{b.equipo?` · ${b.equipo}`:""}</div>
                  {b.notas&&<div style={{fontSize:11,color:"var(--text2)",marginTop:3,fontStyle:"italic"}}>"{b.notas}"</div>}
                </div>
                <span style={{fontSize:11,background:statusBg[b.status],color:statusColor[b.status],padding:"3px 8px",borderRadius:4,fontWeight:600,whiteSpace:"nowrap",flexShrink:0}}>{b.status}</span>
              </div>
              {/* Technician assigned */}
              {b.technician_id&&(()=>{
                const t=techs.find(x=>x.id===b.technician_id);

              })()}
              {/* Video link */}
              {b.video_link&&<div style={{marginBottom:6}}><a href={b.video_link} target="_blank" style={{fontSize:11,color:"#185FA5",background:"#E6F1FB",borderRadius:6,padding:"4px 8px",textDecoration:"none",display:"inline-block"}}>📹 Entrar a videollamada</a></div>}
              {/* Timestamps */}
              {b.accepted_at&&<div style={{fontSize:10,color:"var(--text2)",marginBottom:4}}>✅ Aceptado: {new Date(b.accepted_at).toLocaleString("es-HN")}</div>}
              {b.completed_at&&<div style={{fontSize:10,color:"var(--text2)",marginBottom:4}}>🏁 Completado: {new Date(b.completed_at).toLocaleString("es-HN")}</div>}
              {b.status==="pendiente"&&(
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>setAssignModal(b)} style={{flex:1,background:"#E1F5EE",color:"#0F6E56",border:"none",borderRadius:7,padding:"6px",fontSize:12,fontWeight:600,cursor:"pointer"}}>👤 Asignar técnico</button>
                  <button onClick={()=>updateBooking(b.id,{status:"cancelado"})} style={{background:"#FCEBEB",color:"#E74C3C",border:"none",borderRadius:7,padding:"6px 10px",fontSize:12,fontWeight:600,cursor:"pointer"}}>✗</button>
                </div>
              )}
              {b.status==="confirmado"&&(
                <button onClick={()=>updateBooking(b.id,{status:"completado"})} style={{width:"100%",background:"#E6F1FB",color:"#185FA5",border:"none",borderRadius:7,padding:"6px",fontSize:12,fontWeight:600,cursor:"pointer"}}>✓ Marcar como completado</button>
              )}

          ))}

      {!loading&&bookings.length===0&&(

          <div style={{fontSize:40,marginBottom:8}}>📅</div>
          <div>Sin citas aún. Comparte el link con tus clientes.</div>
        </div>
      )}

      {/* Assign technician modal */}
      {assignModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"var(--card)",borderRadius:16,padding:20,width:"100%",maxWidth:360}}>
            <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>👤 Asignar técnico</div>
            <div style={{fontSize:12,color:"var(--text2)",marginBottom:12}}>
              {assignModal.client_name} · {assignModal.date} {assignModal.time}
              {assignModal.modalidad==="videollamada"&&<span style={{marginLeft:6,color:"#185FA5",fontWeight:600}}>📹 Videollamada</span>}
            </div>
            {techs.filter(t=>t.role!=="admin").map(t=>(
              <button key={t.id} onClick={()=>assignTech(assignModal.id,t.id)}
                style={{width:"100%",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px",marginBottom:6,textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
                <Avatar initials={t.name.split(" ").map(w=>w[0]).join("").slice(0,2)} color={t.color||"blue"} size={32}/>
                <div>
                  <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{t.name}</div>
                  <div style={{fontSize:11,color:"var(--text2)"}}>{t.role==="ventas"?"Ventas":"Técnico"} · {t.status==="available"?"Disponible":"En ruta"}</div>
                </div>
              </button>
            ))}
            <button onClick={()=>setAssignModal(null)} style={{width:"100%",marginTop:4,background:"transparent",color:"var(--text2)",border:"1px solid var(--border)",borderRadius:8,padding:"8px",fontSize:12,cursor:"pointer"}}>Cancelar</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── LIVE TRACKING PAGE ──────────────────────────────────────────────────────
function LiveTracking({techs,clients,mapsKey}){
  const [positions,setPositions]=useState([]);
  const [selected,setSelected]=useState(null);
  const mapRef=useRef(null);
  const markersRef=useRef({});
  const mapObjRef=useRef(null);

  // Poll every 5 seconds
  useEffect(()=>{
    const load=async()=>{
      try{
        const data=await fetch("/api/gps/live").then(r=>r.json());
        setPositions(data);
      }catch(e){}
    };
    load();
    const interval=setInterval(load,5000);
    return()=>clearInterval(interval);
  },[]);

  // Update Google Maps markers
  useEffect(()=>{
    if(!mapsKey||!window.google?.maps) return;
    if(!mapObjRef.current&&mapRef.current){
      mapObjRef.current=new window.google.maps.Map(mapRef.current,{
        zoom:12,center:{lat:14.0999,lng:-87.2062},
        mapTypeControl:false,streetViewControl:false,
        styles:[{featureType:"poi",stylers:[{visibility:"off"}]}]
      });
    }
    if(!mapObjRef.current) return;
    const map=mapObjRef.current;
    const activeIds=new Set(positions.map(p=>p.technicianId));
    
    // Remove markers for offline techs
    Object.keys(markersRef.current).forEach(id=>{
      if(!activeIds.has(id)){markersRef.current[id].setMap(null);delete markersRef.current[id];}
    });

    // Add/update markers
    positions.forEach(pos=>{
      const tech=techs.find(t=>t.id===pos.technicianId);
      const label=tech?.name.split(" ").map(w=>w[0]).join("").slice(0,2)||"??";
      if(!markersRef.current[pos.technicianId]){
        markersRef.current[pos.technicianId]=new window.google.maps.Marker({
          position:{lat:pos.lat,lng:pos.lng},map,
          label:{text:label,color:"white",fontWeight:"bold",fontSize:"11px"},
          icon:{path:window.google.maps.SymbolPath.CIRCLE,fillColor:"#185FA5",fillOpacity:1,strokeColor:"white",strokeWeight:2,scale:18}
        });
        markersRef.current[pos.technicianId].addListener("click",()=>setSelected(pos.technicianId));
      } else {
        markersRef.current[pos.technicianId].setPosition({lat:pos.lat,lng:pos.lng});
      }
    });

    // Auto-fit bounds
    if(positions.length>0){
      const bounds=new window.google.maps.LatLngBounds();
      positions.forEach(p=>bounds.extend({lat:p.lat,lng:p.lng}));
      map.fitBounds(bounds,{top:60,right:40,bottom:40,left:40});
    }
  },[positions,mapsKey,techs]);

  const selectedPos=positions.find(p=>p.technicianId===selected);
  const selectedTech=techs.find(t=>t.id===selected);

  return(
    <div style={{padding:"0 0 40px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{fontWeight:800,fontSize:20,color:"var(--text)"}}>🗺️ Tracking en vivo</div>
          <div style={{fontSize:13,color:"var(--text2)",marginTop:2}}>{positions.length} técnico{positions.length!==1?"s":""} en ruta · actualiza cada 5s</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:"#1D9E75",animation:"pulse 2s infinite"}}/>
          <span style={{fontSize:12,color:"#1D9E75",fontWeight:600}}>En vivo</span>
        </div>
      </div>

      {/* Map */}
      {mapsKey?(
        <div ref={mapRef} style={{width:"100%",height:400,borderRadius:12,border:"1px solid var(--border)",marginBottom:16,overflow:"hidden"}}/>
      ):(
        <div style={{background:"var(--surface)",borderRadius:12,padding:40,textAlign:"center",marginBottom:16,border:"1px solid var(--border)"}}>
          <div style={{fontSize:24,marginBottom:8}}>🗺️</div>
          <div style={{fontSize:14,color:"var(--text2)"}}>Configura Google Maps API Key en Ajustes para ver el mapa</div>
        </div>
      )}

      {/* Technician list */}
      {positions.length===0?(
        <div style={{textAlign:"center",padding:"30px 0",color:"var(--text2)",fontSize:14}}>
          <div style={{fontSize:32,marginBottom:8}}>📍</div>
          Sin técnicos en ruta ahora mismo
        </div>
      ):(
        <div>
          {positions.map(pos=>{
            const tech=techs.find(t=>t.id===pos.technicianId);
            const isSelected=selected===pos.technicianId;
            return(
              <div key={pos.technicianId} onClick={()=>setSelected(isSelected?null:pos.technicianId)}
                style={{background:isSelected?"#E6F1FB":"var(--card)",border:`1px solid ${isSelected?"#185FA5":"var(--border)"}`,borderRadius:12,padding:"14px 16px",marginBottom:8,cursor:"pointer",transition:"all 0.2s"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <Avatar initials={tech?.name.split(" ").map(w=>w[0]).join("").slice(0,2)||"??"} color={tech?.color||"blue"} size={36}/>
                    <div>
                      <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{tech?.name||"Técnico"}</div>
                      <div style={{fontSize:12,color:"#1D9E75",marginTop:1}}>🟢 En ruta · {pos.km?.toFixed?.(1)||0} km</div>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:11,color:"var(--text2)"}}>Hace {Math.round((Date.now()-new Date(pos.timestamp).getTime())/1000)}s</div>
                    <button onClick={e=>{e.stopPropagation();window.open(`https://www.google.com/maps?q=${pos.lat},${pos.lng}`,"_blank");}} style={{fontSize:11,background:"#185FA5",color:"white",border:"none",borderRadius:6,padding:"3px 8px",cursor:"pointer",marginTop:4}}>📍 Ver</button>
                  </div>
                </div>
                {isSelected&&(
                  <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid var(--border)"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                      <div style={{background:"var(--surface)",borderRadius:8,padding:"8px 10px"}}>
                        <div style={{fontSize:10,color:"var(--text2)",textTransform:"uppercase",marginBottom:3}}>Destino</div>
                        <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{pos.clientName||pos.destName||"—"}</div>
                      </div>
                      <div style={{background:"var(--surface)",borderRadius:8,padding:"8px 10px"}}>
                        <div style={{fontSize:10,color:"var(--text2)",textTransform:"uppercase",marginBottom:3}}>Tipo de visita</div>
                        <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{pos.tripType||"—"}</div>
                      </div>
                      <div style={{background:"var(--surface)",borderRadius:8,padding:"8px 10px"}}>
                        <div style={{fontSize:10,color:"var(--text2)",textTransform:"uppercase",marginBottom:3}}>Km recorridos</div>
                        <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{pos.km?.toFixed?.(1)||0} km</div>
                      </div>
                      <div style={{background:"var(--surface)",borderRadius:8,padding:"8px 10px"}}>
                        <div style={{fontSize:10,color:"var(--text2)",textTransform:"uppercase",marginBottom:3}}>Última posición</div>
                        <div style={{fontSize:12,color:"var(--text)"}}>{pos.lat?.toFixed?.(4)}, {pos.lng?.toFixed?.(4)}</div>
                      </div>
                    </div>
                    <button onClick={e=>{e.stopPropagation();window.open(`https://www.google.com/maps/dir/?api=1&destination=${pos.lat},${pos.lng}`,"_blank");}} style={{width:"100%",marginTop:8,background:"#185FA5",color:"white",border:"none",borderRadius:8,padding:"9px",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                      🗺️ Abrir en Google Maps
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── ADMIN REPORTS PAGE ──────────────────────────────────────────────────────
function AdminReports({reports,techs,clients}){
  const [filterTech,setFilterTech]=useState("all");
  
  // Group by technician, sorted A-Z
  const sortedTechs=[...techs].sort((a,b)=>a.name.localeCompare(b.name));
  const filtered=reports.filter(r=>filterTech==="all"||r.technicianId===filterTech);
  
  return(
    <div style={{padding:"0 0 40px"}}>
      <div style={{fontWeight:800,fontSize:20,color:"var(--text)",marginBottom:4}}>Reportes de visita</div>
      <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>{reports.length} reportes totales</div>
      
      {/* Filter by tech */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
        <button onClick={()=>setFilterTech("all")} style={{padding:"5px 12px",borderRadius:20,border:"1px solid var(--border)",fontSize:12,cursor:"pointer",background:filterTech==="all"?"#185FA5":"var(--surface)",color:filterTech==="all"?"white":"var(--text)"}}>Todos</button>
        {sortedTechs.map(t=>(
          <button key={t.id} onClick={()=>setFilterTech(t.id)} style={{padding:"5px 12px",borderRadius:20,border:"1px solid var(--border)",fontSize:12,cursor:"pointer",background:filterTech===t.id?"#185FA5":"var(--surface)",color:filterTech===t.id?"white":"var(--text)"}}>{t.name}</button>
        ))}
      </div>

      {/* Reports grouped by tech */}
      {sortedTechs.filter(t=>filterTech==="all"||t.id===filterTech).map(tech=>{
        const techReports=filtered.filter(r=>r.technicianId===tech.id);
        if(techReports.length===0) return null;
        return(
          <div key={tech.id} style={{marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <Avatar initials={tech.name.split(" ").map(w=>w[0]).join("").slice(0,2)} color={tech.color} size={28}/>
              <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{tech.name}</div>
              <span style={{fontSize:12,color:"var(--text2)"}}>({techReports.length} reporte{techReports.length!==1?"s":""})</span>
            </div>
            {techReports.map(rep=>{
              const cl=clients.find(c=>c.id===rep.clientId);
              return(
                <div key={rep.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                      <span style={{fontSize:12,fontWeight:700,color:"#0F6E56",fontFamily:"monospace"}}>{rep.reportNum}</span>
                      {rep.signed&&<span style={{fontSize:10,background:"#E1F5EE",color:"#0F6E56",padding:"2px 6px",borderRadius:4,fontWeight:600}}>✍️ Firmado</span>}
                    </div>
                    <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{cl?.name||"—"}</div>
                    <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>{rep.fecha} · Llegada: {rep.horaLlegada} · Salida: {rep.horaSalida}</div>
                    {(rep.marca||rep.modelo)&&<div style={{fontSize:11,color:"var(--text2)",marginTop:1}}>🔧 {[rep.marca,rep.modelo,rep.serie].filter(Boolean).join(" — ")}</div>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                    <div style={{fontSize:20}}>{rep.signed?"✅":"⏳"}</div>
                    <button onClick={()=>window.open(`/api/reports/${rep.id}/pdf`,"_blank")} style={{background:"#0F6E56",color:"white",border:"none",borderRadius:6,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>📄 Ver PDF</button>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
      {filtered.length===0&&<div style={{textAlign:"center",color:"var(--text2)",padding:"40px 0",fontSize:14}}>Sin reportes aún</div>}
    </div>
  );
}

function App(){
  const [user,setUser]=useState(()=>LS.get("lt_user",null));
  const [dark,setDark]=useState(false);
  const [page,setPage]=useState(()=>LS.get("lt_user",null)?.role==="admin"?"dashboard":"app");
  const [techs,setTechs]=useState([]);
  const [inventory,setInventory]=useState([]);
  const [clients,setClients]=useState([]);
  const [trips,setTrips]=useState([]);
  const [reports,setReports]=useState([]);
  const [rate,setRate]=useState(5.0);
  const [mapsKey,setMapsKey]=useState("");
  const [companyName,setCompanyName]=useState("Servvoo");
  const [fuelGasPrice,setFuelGasPrice]=useState(95);
  const [fuelDieselPrice,setFuelDieselPrice]=useState(85);
  const [viewTrip,setViewTrip]=useState(null);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [sideOpen,setSideOpen]=useState(window.innerWidth>768);

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3200);};

  const loadAll=async()=>{
    try{
      const [t,i,c,tr,s,reps]=await Promise.all([API.get("/api/users"),API.get("/api/inventory"),API.get("/api/clients"),API.get("/api/trips"),API.get("/api/settings"),API.get("/api/reports")]);
      setTechs(t);setInventory(i);setClients(c);setTrips(tr);setReports(reps||[]);
      if(s.rate_per_km) setRate(parseFloat(s.rate_per_km));
      if(s.maps_api_key) setMapsKey(s.maps_api_key);
      if(s.company_name) setCompanyName(s.company_name);
      if(s.fuel_gas_price) setFuelGasPrice(parseFloat(s.fuel_gas_price));
      if(s.fuel_diesel_price) setFuelDieselPrice(parseFloat(s.fuel_diesel_price));
    }catch(e){showToast("No se pudo conectar al servidor","error");}
    setLoading(false);
  };

  useEffect(()=>{if(user) loadAll();},[user]);

  const handleLogin=u=>{LS.set("lt_user",u);setUser(u);setPage(u.role==="admin"?"dashboard":"app");};
  const handleLogout=()=>{LS.set("lt_user",null);setUser(null);setPage("dashboard");};

  const approveTrip=async(id)=>{
    await API.patch(`/api/trips/${id}`,{status:"aprobado"});
    setTrips(p=>p.map(t=>t.id===id?{...t,status:"aprobado"}:t));
    setViewTrip(null);showToast("Viaje aprobado ✓");
  };
  const saveRate=async v=>{await API.post("/api/settings",{rate_per_km:v});setRate(v);showToast("Tasa guardada ✓");};
  const saveMapsKey=async v=>{await API.post("/api/settings",{maps_api_key:v});setMapsKey(v);showToast("API Key guardada ✓");};
  const saveCompany=async v=>{await API.post("/api/settings",{company_name:v});setCompanyName(v);showToast("Nombre guardado ✓");};
  const saveFuelPrices=async(gas,diesel)=>{await API.post("/api/settings",{fuel_gas_price:gas,fuel_diesel_price:diesel});setFuelGasPrice(gas);setFuelDieselPrice(diesel);showToast("Precios de combustible guardados ✓");};
  const addTech=async d=>{const t=await API.post("/api/users",d);setTechs(p=>[...p,t]);showToast("Técnico agregado ✓");};
  const updateTech=async(id,d)=>{const t=await API.patch(`/api/users/${id}`,d);setTechs(p=>p.map(x=>x.id===id?t:x));showToast("Técnico actualizado ✓");};
  const deleteTech=async(id)=>{await API.delete(`/api/users/${id}`);setTechs(p=>p.filter(x=>x.id!==id));showToast("Técnico eliminado ✓");};
  const addInventory=async d=>{const eq=await API.post("/api/inventory",d);setInventory(p=>[...p,eq]);showToast("Equipo agregado ✓");};
  const addClient=async d=>{const c=await API.post("/api/clients",d);setClients(p=>[...p,c]);showToast("Cliente agregado ✓");};
  const saveTrip=async d=>{const t=await API.post("/api/trips",d);setTrips(p=>[t,...p]);showToast("¡Viaje guardado y enviado! ✓");return t;};

  if(!user) return <AuthScreen onLogin={handleLogin}/>;

  const isMobile=window.innerWidth<=768;
  const isAdmin=user.role==="admin";

  const theme={"--bg":dark?"#0f1117":"#f4f6f9","--card":dark?"#181b22":"#ffffff","--surface":dark?"#1f2330":"#eef1f5","--border":dark?"#2a2f3e":"#dde1e8","--text":dark?"#e4e7ef":"#14181f","--text2":dark?"#7c8698":"#6b7685","--accent":"#185FA5"};

  const adminNav=[
    {id:"dashboard",l:"Panel",i:"📊"},
    {id:"viajes",l:"Viajes",i:"🚗"},
    {id:"tracking",l:"En vivo",i:"🗺️"},
    {id:"ventas",l:"Ventas",i:"🎯"},
    {id:"reportes",l:"Reportes",i:"📄"},
    {id:"inventario",l:"Inventario",i:"📦"},
    {id:"diprodi_inv",l:"Equipos",i:"🔬"},
    {id:"clientes",l:"Clientes",i:"🏥"},
    {id:"tecnicos",l:"Empleados",i:"👥"},
    {id:"agenda",l:"Agenda",i:"📅"},
    {id:"facturacion",l:"Facturas",i:"🧾"},
    {id:"calendario",l:"Calendario",i:"📅"},
    {id:"finanzas",l:"Finanzas",i:"📊"},
    {id:"ia",l:"IA",i:"🤖"},
    {id:"ajustes",l:"Ajustes",i:"⚙️"},
  ];
  const techNav=[
    {id:"app",l:"Mi App",i:"📱"},
    {id:"viajes",l:"Mis Viajes",i:"🚗"},
    {id:"mis_reportes",l:"Mis Reportes",i:"📄"},
  ];
  const nav=isAdmin?adminNav:techNav;
  const pendingCount=trips.filter(t=>t.status==="pendiente").length;
  const initials=user.name.split(" ").map(w=>w[0]).join("").slice(0,2);

  return(
    <div style={{...theme,minHeight:"100vh",background:"var(--bg)",color:"var(--text)",display:"flex"}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>

      {/* Sidebar */}
      <div style={{width:sideOpen?215:0,minWidth:sideOpen?215:0,height:"100vh",position:"sticky",top:0,background:"var(--card)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",overflow:"hidden",transition:"all .2s",zIndex:100}}>
        <div style={{padding:"18px 16px 12px",borderBottom:"1px solid var(--border)"}}>
          <div style={{fontSize:21,fontWeight:800,color:"var(--accent)",letterSpacing:"-0.5px"}}>Lab<span style={{color:"var(--text)"}}>{companyName.replace("Lab","")}</span></div>
          <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>Operaciones de campo</div>
          <div style={{marginTop:8,display:"inline-flex",alignItems:"center",gap:5,background:"#E1F5EE",borderRadius:20,padding:"3px 10px"}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:"#1D9E75"}}/>
            <span style={{fontSize:10,color:"#085041",fontWeight:600}}>Base de datos en vivo</span>
          </div>
        </div>
        <nav style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
          {nav.map(n=>(
            <button key={n.id} onClick={()=>{setPage(n.id);if(isMobile)setSideOpen(false);}} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:9,border:"none",background:page===n.id?"#E6F1FB":"transparent",color:page===n.id?"#185FA5":"var(--text2)",fontWeight:page===n.id?700:400,fontSize:13,cursor:"pointer",marginBottom:2,textAlign:"left",fontFamily:"inherit"}}>
              <span style={{fontSize:16}}>{n.i}</span>{n.l}
              {n.id==="viajes"&&pendingCount>0&&isAdmin&&<span style={{marginLeft:"auto",background:"#993C1D",color:"white",borderRadius:20,fontSize:10,padding:"1px 7px",fontWeight:700}}>{pendingCount}</span>}
            </button>
          ))}
        </nav>
        <div style={{padding:"12px 14px",borderTop:"1px solid var(--border)"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <Avatar initials={initials} color={user.color||"blue"} size={30}/>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div><div style={{fontSize:10,color:"var(--text2)"}}>{user.role==="admin"?"Administrador":"Técnico"}</div></div>
          </div>
          <button onClick={handleLogout} style={{width:"100%",padding:"7px",borderRadius:8,border:"1px solid var(--border)",background:"transparent",color:"var(--text2)",fontSize:12,cursor:"pointer"}}>Cerrar sesión</button>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
        <div style={{padding:"12px 20px",borderBottom:"1px solid var(--border)",background:"var(--card)",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:50}}>
          <button onClick={()=>setSideOpen(s=>!s)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text2)",fontSize:20,padding:4,borderRadius:6,flexShrink:0}}>☰</button>
          <h1 style={{fontSize:17,fontWeight:800,color:"var(--text)",margin:0,flex:1}}>{nav.find(n=>n.id===page)?.i} {nav.find(n=>n.id===page)?.l}</h1>
          <button onClick={loadAll} style={{background:"none",border:"1px solid var(--border)",cursor:"pointer",color:"var(--text2)",fontSize:12,padding:"6px 12px",borderRadius:8,whiteSpace:"nowrap"}}>↻ Actualizar</button>
          {isAdmin&&<div style={{fontSize:12,color:"var(--text2)",display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
            <span style={{width:7,height:7,borderRadius:"50%",background:"#1D9E75",display:"inline-block"}}/>
            {techs.filter(t=>t.status==="on_route").length} en ruta
          </div>}
        </div>
        <div style={{flex:1,padding:"22px 24px",overflowY:"auto"}}>
          {loading?<Spinner/>:<>
            {page==="dashboard" &&isAdmin&&<Dashboard trips={trips} techs={techs} inventory={inventory} clients={clients} onViewTrip={setViewTrip}/>}
            {page==="viajes"    &&<Viajes trips={isAdmin?trips:trips.filter(t=>t.technicianId===user.id)} techs={techs} clients={clients} inventory={inventory} onViewTrip={setViewTrip} isAdmin={isAdmin}/>}
            {page==="inventario"&&isAdmin&&<Inventario inventory={inventory} onAdd={addInventory}/>}
            {page==="clientes"  &&isAdmin&&<Clientes clients={clients} onAdd={addClient} trips={trips} inventory={inventory}/>}
            {page==="tecnicos"  &&isAdmin&&<Tecnicos techs={techs} onAdd={addTech} onUpdate={updateTech} onDelete={deleteTech} trips={trips}/>}
            {page==="app"       &&!isAdmin&&<AppEmpleado user={user} trips={trips} onSaveTrip={saveTrip} inventory={inventory} clients={clients} rate={rate} mapsKey={mapsKey} reports={reports} fuelGasPrice={fuelGasPrice} fuelDieselPrice={fuelDieselPrice}/>}
            {page==="tracking"  &&isAdmin&&<LiveTracking techs={techs} clients={clients} mapsKey={mapsKey}/>}
            {page==="agenda"    &&isAdmin&&<AgendaAdmin techs={techs}/>}
            {page==="calendario"&&isAdmin&&<CalendarioAdmin companyId="diprodi"/>}
            {page==="finanzas"  &&isAdmin&&<ResumenFinanciero companyId="diprodi"/>}
            {page==="ia"        &&isAdmin&&<AIAssistant user={user} companyId="diprodi"/>}
            {page==="facturacion"&&isAdmin&&<Facturacion clients={clients} techs={techs} repuestos={[]} inventory={inventory}/>}
            {page==="ventas"    &&isAdmin&&<SalesAdmin techs={techs}/>}
            {page==="diprodi_inv"&&isAdmin&&<DiprodInventario mapsKey={mapsKey}/>}
            {page==="reportes"  &&isAdmin&&<AdminReports reports={reports} techs={techs} clients={clients}/>}
            {page==="mis_reportes"&&!isAdmin&&<AdminReports reports={reports.filter(r=>r.technicianId===user.id)} techs={techs} clients={clients} soloMio={true}/>}
            {page==="ajustes"   &&isAdmin&&<Ajustes rate={rate} onSaveRate={saveRate} mapsKey={mapsKey} onSaveMapsKey={saveMapsKey} companyName={companyName} onSaveCompany={saveCompany} dark={dark} setDark={setDark} fuelGasPrice={fuelGasPrice} fuelDieselPrice={fuelDieselPrice} onSaveFuelPrices={saveFuelPrices}/>}
          </>}
        </div>
      </div>

      {viewTrip&&<TripDetail trip={viewTrip} techs={techs} clients={clients} inventory={inventory} onClose={()=>setViewTrip(null)} onApprove={isAdmin?approveTrip:null} mapsKey={mapsKey} fuelGasPrice={fuelGasPrice} fuelDieselPrice={fuelDieselPrice}/>}
      {toast&&<div style={{position:"fixed",bottom:24,right:24,background:toast.type==="error"?"#A32D2D":"#0F6E56",color:"white",padding:"12px 20px",borderRadius:10,fontSize:13,fontWeight:600,zIndex:9999,boxShadow:"0 4px 20px rgba(0,0,0,.2)"}}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
