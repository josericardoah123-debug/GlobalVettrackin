                {/* Notas */}
                <div style={{marginBottom:12}}>
                  <label style={{fontSize:11,color:"var(--text2)",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.04em"}}>Notas</label>
                  <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={2} placeholder="Observaciones..." style={{width:"100%",padding:"8px 11px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:12,resize:"none"}}/>
                </div>

                {/* Botones */}
                <button onClick={openWaze} style={{width:"100%",background:"#1D9E75",color:"white",border:"none",borderRadius:10,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                  🗺️ Ver mejor ruta en Google Maps
                </button>
                <button onClick={start} style={{width:"100%",background:"#185FA5",color:"white",border:"none",borderRadius:14,padding:"14px",fontSize:14,fontWeight:800,cursor:"pointer"}}>
                  ▶ Iniciar viaje y GPS
                </button>
              </div>
            )}

            {/* VIAJE ACTIVO */}
            {tab==="activo"&&active&&(
              <div>
                {/* GPS Status */}
                <div style={{background:gpsError?"#FCEBEB":"#E1F5EE",borderRadius:10,padding:"10px 13px",marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:gpsError?"#A32D2D":"#1D9E75",flexShrink:0,boxShadow:gpsError?"none":"0 0 0 3px rgba(29,158,117,.25)"}}/>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:gpsError?"#A32D2D":"#085041"}}>{gpsError?"Error de GPS":"GPS activo — rastreando"}</div>
                    <div style={{fontSize:11,color:gpsError?"#A32D2D":"#0F6E56"}}>{gpsError||`${mins}m ${secs}s · ${gpsPts.length} puntos`}</div>
                  </div>
                </div>

                {/* Km grande */}
                <div style={{textAlign:"center",padding:"10px 0 14px"}}>
                  <div style={{fontSize:52,fontWeight:800,color:"var(--text)",lineHeight:1,fontFamily:"'DM Mono',monospace"}}>{km.toFixed(1)}</div>
                  <div style={{fontSize:12,color:"var(--text2)",marginTop:4}}>km recorridos</div>
                </div>

                {/* Paradas activas */}
                {stops.filter(s=>s.clientId).length>0&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Paradas del viaje</div>
                    {stops.filter(s=>s.clientId).map((stop,idx)=>{
                      const cl=clients.find(c=>c.id===stop.clientId);
                      const timer=stopTimers[idx];
                      const done=timer?.departureStr;
                      const inProgress=timer?.arrivalStr&&!done;
                      return(
                        <div key={idx} style={{background:done?"#EAF3DE":inProgress?"#FAEEDA":"var(--surface)",borderRadius:10,padding:"10px 12px",marginBottom:6,border:`1px solid ${done?"#639922":inProgress?"#EF9F27":"var(--border)"}`}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                            <div>
                              <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>📍 {cl?.name}</div>
                              <div style={{fontSize:11,color:"var(--text2)"}}>{stop.type} · {cl?.city}</div>
                              {inProgress&&<div style={{fontSize:11,color:"#854F0B",marginTop:2}}>⏱ Tiempo en parada: {Math.floor((stopTimers[idx]?.elapsed||0)/60)}m {(stopTimers[idx]?.elapsed||0)%60}s</div>}
                              {done&&<div style={{fontSize:11,color:"#3B6D11",marginTop:2}}>✓ Llegada: {timer.arrivalStr} · Salida: {timer.departureStr} · {Math.round((timer.departure-timer.arrival)/60000)} min</div>}
                            </div>
                            {!done&&!inProgress&&idx===currentStopIdx&&(
                              <button onClick={()=>arriveAtStop(idx)} style={{background:"#EF9F27",color:"white",border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>Llegué</button>
                            )}
                            {inProgress&&(
                              <button onClick={()=>departFromStop(idx)} style={{background:"#185FA5",color:"white",border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>Salir</button>
                            )}
                            {done&&<span style={{fontSize:16}}>✅</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Reembolso */}
                <div style={{background:"#EEEDFE",borderRadius:10,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div><div style={{fontSize:11,color:"#3C3489",textTransform:"uppercase",letterSpacing:"0.04em"}}>Reembolso estimado</div><div style={{fontSize:22,fontWeight:800,color:"#26215C",marginTop:2,fontFamily:"'DM Mono',monospace"}}>L. {fmt(reimb)}</div></div>
                  <div style={{fontSize:11,color:"#534AB7"}}>@ L.{rate.toFixed(2)}/km</div>
                </div>

                <button onClick={end} style={{width:"100%",background:"#993C1D",color:"white",border:"none",borderRadius:14,padding:"14px",fontSize:14,fontWeight:800,cursor:"pointer"}}>
                  ■ Finalizar viaje
                </button>
              </div>
            )}

            {/* HISTORIAL */}
            {tab==="historial"&&(
              <div>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:12}}>Mis viajes ({myTrips.length})</div>
                {myTrips.length===0&&<div style={{color:"var(--text2)",fontSize:13,padding:"20px 0",textAlign:"center"}}>Sin viajes aún</div>}
                {myTrips.map(t=>{
                  const cl=clients.find(c=>c.id===t.clientId);
                  return(
                    <div key={t.id} style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px",marginBottom:8}}>
                      <div style={{display:"flex",justifyContent:"space-between"}}>
                        <div>
                          <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{cl?.name||"—"}</div>
                          <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>{t.date} · {t.km} km · {t.tripType}</div>
                          {(t.stops||[]).length>0&&<div style={{fontSize:11,color:"#854F0B",marginTop:1}}>📍 {t.stops.length} parada{t.stops.length!==1?"s":""}</div>}
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontWeight:800,fontSize:13,color:"#185FA5"}}>L.{fmt(t.reimbursement)}</div>
                          <div style={{marginTop:3}}><Badge type={t.status}>{t.status}</Badge></div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* PERFIL */}
            {tab==="perfil"&&(
              <div style={{padding:"8px 0"}}>
                <div style={{textAlign:"center",padding:"16px 0 20px"}}>
                  <Avatar initials={initials} color={user.color} size={68}/>
                  <div style={{fontWeight:800,fontSize:17,color:"var(--text)",marginTop:12}}>{user.name}</div>
                  <div style={{fontSize:13,color:"var(--text2)",marginTop:4}}>{user.email}</div>
                  <div style={{fontSize:12,background:"#E6F1FB",color:"#185FA5",display:"inline-block",padding:"3px 12px",borderRadius:20,marginTop:6,fontWeight:600}}>{user.role==="admin"?"Administrador":"Técnico"}</div>
                </div>
                <div style={{background:"var(--surface)",borderRadius:12,padding:14}}>
                  {[["Total viajes",myTrips.length],["Total km",`${myTrips.reduce((s,t)=>s+t.km,0)} km`],["Este mes",`${monthTrips.length} viajes · ${monthTrips.reduce((s,t)=>s+t.km,0)} km`],["Pendiente",`L.${fmt(pendingAmt)}`],["Reembolsado",`L.${fmt(myTrips.filter(t=>t.status==="reembolsado").reduce((s,t)=>s+t.reimbursement,0))}`]].map(([l,v],i,a)=>(
                    <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:i<a.length-1?"1px solid var(--border)":"none",fontSize:13}}><span style={{color:"var(--text2)"}}>{l}</span><span style={{fontWeight:700,color:"var(--text)"}}>{v}</span></div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Tab bar */}
          <div style={{display:"flex",borderTop:"1px solid var(--border)",padding:"8px 0 6px",background:"var(--card)"}}>
            {[{k:"inicio",i:"🏠",l:"Inicio"},{k:"viaje",i:"🚗",l:"Viaje"},{k:"historial",i:"📋",l:"Historial"},{k:"perfil",i:"👤",l:"Perfil"}].map(t=>(
              <button key={t.k} onClick={()=>{if(t.k==="viaje"&&active){setTab("activo");return;}setTab(t.k);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 0",color:(tab===t.k||(t.k==="viaje"&&tab==="activo"))?"#185FA5":"var(--text2)"}}>
                <span style={{fontSize:20}}>{t.i}</span>
                <span style={{fontSize:9,fontWeight:(tab===t.k||(t.k==="viaje"&&tab==="activo"))?700:400}}>{t.l}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── AJUSTES ──────────────────────────────────────────────────────────────────
function Ajustes({rate,onSaveRate,mapsKey,onSaveMapsKey,companyName,onSaveCompany,dark,setDark}){
  const [rateVal,setRateVal]=useState(rate);
  const [keyVal,setKeyVal]=useState(mapsKey||"");
  const [nameVal,setNameVal]=useState(companyName||"");
  useEffect(()=>{setRateVal(rate);},[rate]);
  return(
    <div style={{maxWidth:560,display:"flex",flexDirection:"column",gap:16}}>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>Nombre de la empresa</div>
        <div style={{display:"flex",gap:8}}>
          <input value={nameVal} onChange={e=>setNameVal(e.target.value)} style={{flex:1,padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13}}/>
          <Btn variant="primary" onClick={()=>onSaveCompany(nameVal)}>Guardar</Btn>
        </div>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>Tasa de reembolso por km</div>
        <div style={{fontSize:13,color:"var(--text2)",marginBottom:14}}>Se aplica a todos los viajes nuevos</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:15,color:"var(--text2)",fontWeight:600}}>L.</span>
          <input type="number" value={rateVal} step="0.5" min="1" onChange={e=>setRateVal(+e.target.value)} style={{width:110,padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:16,fontWeight:700,fontFamily:"'DM Mono',monospace"}}/>
          <span style={{fontSize:14,color:"var(--text2)"}}>por km</span>
          <div style={{marginLeft:"auto"}}><Btn variant="primary" onClick={()=>onSaveRate(rateVal)}>Guardar tasa</Btn></div>
        </div>
        <div style={{marginTop:10,fontSize:12,color:"var(--text2)"}}>Ejemplo: 100 km → <strong>L.{fmt(rateVal*100)}</strong></div>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:4}}>Google Maps API Key</div>
        <div style={{fontSize:13,color:"var(--text2)",marginBottom:10,lineHeight:1.6}}>
          Ingresa tu API Key para mostrar mapas reales en los viajes.<br/>
          Obtenla gratis en: <a href="https://console.cloud.google.com" target="_blank" style={{color:"var(--accent)"}}>console.cloud.google.com</a>
          <br/><span style={{fontSize:12,color:"#3B6D11"}}>✓ El nivel gratuito cubre +40,000 cargas de mapa/mes</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          <input value={keyVal} onChange={e=>setKeyVal(e.target.value)} placeholder="AIzaSy..." type="password" style={{flex:1,padding:"9px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13,fontFamily:"monospace"}}/>
          <Btn variant="primary" onClick={()=>onSaveMapsKey(keyVal)}>Guardar</Btn>
        </div>
        {!mapsKey&&<div style={{marginTop:8,fontSize:12,color:"#854F0B",background:"#FAEEDA",borderRadius:6,padding:"6px 10px"}}>Sin API Key: se muestra mapa SVG básico en los viajes</div>}
        {mapsKey&&<div style={{marginTop:8,fontSize:12,color:"#3B6D11",background:"#EAF3DE",borderRadius:6,padding:"6px 10px"}}>✓ Google Maps activo</div>}
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:12}}>Apariencia</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:13,color:"var(--text2)"}}>Modo oscuro</span>
          <button onClick={()=>setDark(d=>!d)} style={{background:dark?"#185FA5":"var(--surface)",border:"1px solid var(--border)",borderRadius:20,padding:"6px 18px",fontSize:13,cursor:"pointer",color:dark?"white":"var(--text)",fontWeight:600}}>{dark?"● Activado":"○ Desactivado"}</button>
        </div>
      </div>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:20}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text)",marginBottom:8}}>Acerca de LabTrack</div>
        <div style={{fontSize:13,color:"var(--text2)",lineHeight:1.8}}>Versión 2.0 · Plataforma de operaciones de campo<br/>Diseñado para empresas de equipos de laboratorio en Honduras 🇭🇳<br/><br/><span style={{color:"#1D9E75",fontWeight:600}}>✓ Conectado a base de datos en vivo</span></div>
      </div>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(()=>LS.get("lt_user",null));
  const [dark,setDark]=useState(false);
  const [page,setPage]=useState("dashboard");
  const [techs,setTechs]=useState([]);
  const [inventory,setInventory]=useState([]);
  const [clients,setClients]=useState([]);
  const [trips,setTrips]=useState([]);
  const [rate,setRate]=useState(5.0);
  const [mapsKey,setMapsKey]=useState("");
  const [companyName,setCompanyName]=useState("LabTrack");
  const [viewTrip,setViewTrip]=useState(null);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [sideOpen,setSideOpen]=useState(window.innerWidth>768);

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3200);};

  const loadAll=async()=>{
    try{
      const [t,i,c,tr,s]=await Promise.all([API.get("/api/technicians"),API.get("/api/inventory"),API.get("/api/clients"),API.get("/api/trips"),API.get("/api/settings")]);
      setTechs(t);setInventory(i);setClients(c);setTrips(tr);
      if(s.rate_per_km) setRate(parseFloat(s.rate_per_km));
      if(s.maps_api_key) setMapsKey(s.maps_api_key);
      if(s.company_name) setCompanyName(s.company_name);
    }catch(e){showToast("No se pudo conectar al servidor","error");}
    setLoading(false);
  };

  useEffect(()=>{if(user) loadAll();},[user]);

  const handleLogin=u=>{LS.set("lt_user",u);setUser(u);};
  const handleLogout=()=>{LS.set("lt_user",null);setUser(null);setPage("dashboard");};

  const approveTrip=async(id)=>{
    await API.patch(`/api/trips/${id}`,{status:"aprobado"});
    setTrips(p=>p.map(t=>t.id===id?{...t,status:"aprobado"}:t));
    setViewTrip(null);showToast("Viaje aprobado ✓");
  };
  const saveRate=async v=>{await API.post("/api/settings",{rate_per_km:v});setRate(v);showToast("Tasa guardada ✓");};
  const saveMapsKey=async v=>{await API.post("/api/settings",{maps_api_key:v});setMapsKey(v);showToast("API Key guardada ✓");};
  const saveCompany=async v=>{await API.post("/api/settings",{company_name:v});setCompanyName(v);showToast("Nombre guardado ✓");};
  const addTech=async d=>{const t=await API.post("/api/technicians",d);setTechs(p=>[...p,t]);showToast("Técnico agregado ✓");};
  const addInventory=async d=>{const eq=await API.post("/api/inventory",d);setInventory(p=>[...p,eq]);showToast("Equipo agregado ✓");};
  const addClient=async d=>{const c=await API.post("/api/clients",d);setClients(p=>[...p,c]);showToast("Cliente agregado ✓");};
  const saveTrip=async d=>{const t=await API.post("/api/trips",d);setTrips(p=>[t,...p]);showToast("¡Viaje guardado y enviado! ✓");};

  if(!user) return <AuthScreen onLogin={handleLogin}/>;

  const isMobile=window.innerWidth<=768;
  const isAdmin=user.role==="admin";

  const theme={"--bg":dark?"#0f1117":"#f4f6f9","--card":dark?"#181b22":"#ffffff","--surface":dark?"#1f2330":"#eef1f5","--border":dark?"#2a2f3e":"#dde1e8","--text":dark?"#e4e7ef":"#14181f","--text2":dark?"#7c8698":"#6b7685","--accent":"#185FA5"};

  const adminNav=[
    {id:"dashboard",l:"Panel",i:"📊"},
    {id:"viajes",l:"Viajes",i:"🚗"},
    {id:"inventario",l:"Inventario",i:"📦"},
    {id:"clientes",l:"Clientes",i:"🏥"},
    {id:"tecnicos",l:"Técnicos",i:"👷"},
    {id:"ajustes",l:"Ajustes",i:"⚙️"},
  ];
  const techNav=[
    {id:"app",l:"Mi App",i:"📱"},
    {id:"viajes",l:"Mis Viajes",i:"🚗"},
  ];
  const nav=isAdmin?adminNav:techNav;
  const pendingCount=trips.filter(t=>t.status==="pendiente").length;
  const initials=user.name.split(" ").map(w=>w[0]).join("").slice(0,2);

  return(
    <div style={{...theme,minHeight:"100vh",background:"var(--bg)",color:"var(--text)",display:"flex"}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>

      {/* Sidebar */}
      <div style={{width:sideOpen?215:0,minWidth:sideOpen?215:0,height:"100vh",position:"sticky",top:0,background:"var(--card)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",overflow:"hidden",transition:"all .2s",zIndex:100}}>
        <div style={{padding:"18px 16px 12px",borderBottom:"1px solid var(--border)"}}>
          <div style={{fontSize:21,fontWeight:800,color:"var(--accent)",letterSpacing:"-0.5px"}}>Lab<span style={{color:"var(--text)"}}>{companyName.replace("Lab","")}</span></div>
          <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>Operaciones de campo</div>
          <div style={{marginTop:8,display:"inline-flex",alignItems:"center",gap:5,background:"#E1F5EE",borderRadius:20,padding:"3px 10px"}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:"#1D9E75"}}/>
            <span style={{fontSize:10,color:"#085041",fontWeight:600}}>Base de datos en vivo</span>
          </div>
        </div>
        <nav style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
          {nav.map(n=>(
            <button key={n.id} onClick={()=>{setPage(n.id);if(isMobile)setSideOpen(false);}} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:9,border:"none",background:page===n.id?"#E6F1FB":"transparent",color:page===n.id?"#185FA5":"var(--text2)",fontWeight:page===n.id?700:400,fontSize:13,cursor:"pointer",marginBottom:2,textAlign:"left",fontFamily:"inherit"}}>
              <span style={{fontSize:16}}>{n.i}</span>{n.l}
              {n.id==="viajes"&&pendingCount>0&&isAdmin&&<span style={{marginLeft:"auto",background:"#993C1D",color:"white",borderRadius:20,fontSize:10,padding:"1px 7px",fontWeight:700}}>{pendingCount}</span>}
            </button>
          ))}
        </nav>
        <div style={{padding:"12px 14px",borderTop:"1px solid var(--border)"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <Avatar initials={initials} color={user.color||"blue"} size={30}/>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div><div style={{fontSize:10,color:"var(--text2)"}}>{user.role==="admin"?"Administrador":"Técnico"}</div></div>
          </div>
          <button onClick={handleLogout} style={{width:"100%",padding:"7px",borderRadius:8,border:"1px solid var(--border)",background:"transparent",color:"var(--text2)",fontSize:12,cursor:"pointer"}}>Cerrar sesión</button>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
        <div style={{padding:"12px 20px",borderBottom:"1px solid var(--border)",background:"var(--card)",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:50}}>
          <button onClick={()=>setSideOpen(s=>!s)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text2)",fontSize:20,padding:4,borderRadius:6,flexShrink:0}}>☰</button>
          <h1 style={{fontSize:17,fontWeight:800,color:"var(--text)",margin:0,flex:1}}>{nav.find(n=>n.id===page)?.i} {nav.find(n=>n.id===page)?.l}</h1>
          <button onClick={loadAll} style={{background:"none",border:"1px solid var(--border)",cursor:"pointer",color:"var(--text2)",fontSize:12,padding:"6px 12px",borderRadius:8,whiteSpace:"nowrap"}}>↻ Actualizar</button>
          {isAdmin&&<div style={{fontSize:12,color:"var(--text2)",display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
            <span style={{width:7,height:7,borderRadius:"50%",background:"#1D9E75",display:"inline-block"}}/>
            {techs.filter(t=>t.status==="on_route").length} en ruta
          </div>}
        </div>
        <div style={{flex:1,padding:"22px 24px",overflowY:"auto"}}>
          {loading?<Spinner/>:<>
            {page==="dashboard" &&isAdmin&&<Dashboard trips={trips} techs={techs} inventory={inventory} clients={clients} onViewTrip={setViewTrip}/>}
            {page==="viajes"    &&<Viajes trips={isAdmin?trips:trips.filter(t=>t.technicianId===user.id)} techs={techs} clients={clients} inventory={inventory} onViewTrip={setViewTrip}/>}
            {page==="inventario"&&isAdmin&&<Inventario inventory={inventory} onAdd={addInventory}/>}
            {page==="clientes"  &&isAdmin&&<Clientes clients={clients} onAdd={addClient} trips={trips} inventory={inventory}/>}
            {page==="tecnicos"  &&isAdmin&&<Tecnicos techs={techs} onAdd={addTech} trips={trips}/>}
            {page==="app"       &&!isAdmin&&<AppEmpleado user={user} trips={trips} onSaveTrip={saveTrip} inventory={inventory} clients={clients} rate={rate} mapsKey={mapsKey}/>}
            {page==="ajustes"   &&isAdmin&&<Ajustes rate={rate} onSaveRate={saveRate} mapsKey={mapsKey} onSaveMapsKey={saveMapsKey} companyName={companyName} onSaveCompany={saveCompany} dark={dark} setDark={setDark}/>}
          </>}
        </div>
      </div>

      {viewTrip&&<TripDetail trip={viewTrip} techs={techs} clients={clients} inventory={inventory} onClose={()=>setViewTrip(null)} onApprove={approveTrip} mapsKey={mapsKey}/>}
      {toast&&<div style={{position:"fixed",bottom:24,right:24,background:toast.type==="error"?"#A32D2D":"#0F6E56",color:"white",padding:"12px 20px",borderRadius:10,fontSize:13,fontWeight:600,zIndex:9999,boxShadow:"0 4px 20px rgba(0,0,0,.2)"}}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
